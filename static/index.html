async function renderGoals(c) {
  const goals = await getList('goals', 'Failed to load goals');
  const grouped = {};
  lifeAreas.forEach(a => grouped[a.name] = []);
  goals.forEach(g => {
    if (!grouped[g.area_name]) grouped[g.area_name] = [];
    grouped[g.area_name].push(g);
  });
  const priorityLabel = p => p === 2 ? '<span class="priority-high">High</span>' : p === 1 ? '<span class="priority-med">Med</span>' : '<span class="priority-low">Low</span>';

  // Check if we should auto-run daily analysis
  const lastAnalysisKey = 'lifeopt_goal_analysis_date';
  const lastAnalysisData = 'lifeopt_goal_analysis_data';
  const today = new Date().toISOString().slice(0, 10);
  const lastDate = localStorage.getItem(lastAnalysisKey);
  const cachedData = localStorage.getItem(lastAnalysisData);

  c.innerHTML = `
    <div class="page-header">
      <h2>Goals</h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btn-analyze-goals" onclick="runGoalAnalysis()">🧠 AI Analysis</button>
        <button class="btn btn-primary" onclick="openGoalModal()">+ Add Goal</button>
      </div>
    </div>
    <div id="goal-analysis-container"></div>
    ${Object.entries(grouped).map(([area, goals]) => `
      <div class="card">
        <h3>${esc(area)}</h3>
        <ul class="item-list">
          ${goals.map(g => `
            <li class="goal-row">
              <div class="goal-checkbox ${g.is_completed ? 'checked' : ''}" onclick="toggleGoal(${g.id}, ${g.is_completed ? 0 : 1})"></div>
              <div style="flex:1">
                <div class="goal-title ${g.is_completed ? 'completed' : ''}">${esc(g.title)}</div>
                ${g.description ? `<div class="goal-meta">${esc(g.description)}</div>` : ''}
              </div>
              <span class="goal-meta">${priorityLabel(g.priority)}</span>
              ${g.target_date ? `<span class="goal-meta">${esc(g.target_date)}</span>` : ''}
              <div class="item-actions">
                <button class="btn-icon" onclick="openGoalModal(${g.id})">✎</button>
                <button class="btn-icon btn-danger" onclick="deleteGoal(${g.id})">✕</button>
              </div>
            </li>
          `).join('')}
          ${goals.length === 0 ? '<li class="goal-row" style="color:var(--text-muted)">No goals yet</li>' : ''}
        </ul>
      </div>
    `).join('')}`;

  // Show cached analysis immediately, auto-refresh if stale
  const container = document.getElementById('goal-analysis-container');
  if (cachedData) {
    try {
      renderGoalAnalysisPanel(JSON.parse(cachedData), container);
    } catch(e) {}
  }
  if (lastDate !== today) {
    runGoalAnalysis(true);
  }
}

async function runGoalAnalysis(silent) {
  const container = document.getElementById('goal-analysis-container');
  if (!container) return;
  if (!silent) {
    container.innerHTML = `<div class="goal-analysis-panel"><div class="analysis-loading"><span class="spin">⟳</span> Analyzing your goals…</div></div>`;
  }
  try {
    const res = await api('ai/analyze-goals', { method: 'POST', body: { apply: 1 } });
    if (res && res.ok) {
      localStorage.setItem('lifeopt_goal_analysis_date', new Date().toISOString().slice(0, 10));
      localStorage.setItem('lifeopt_goal_analysis_data', JSON.stringify(res));
      renderGoalAnalysisPanel(res, container);
    } else if (!silent) {
      container.innerHTML = `<div class="goal-analysis-panel" style="color:var(--red)">Analysis failed. Please try again.</div>`;
    }
  } catch(e) {
    if (!silent) container.innerHTML = `<div class="goal-analysis-panel" style="color:var(--red)">Error: ${esc(String(e))}</div>`;
  }
}

function renderGoalAnalysisPanel(data, container) {
  if (!container) return;
  if (!data || !data.priority_list || data.priority_list.length === 0) {
    container.innerHTML = '';
    return;
  }
  const goalsById = {};
  (data.goals || []).forEach(g => { goalsById[g.id] = g; });

  const modeLabel = data.mode === 'heuristic' ? '⚙ Heuristic' : '🤖 AI';
  const today = new Date().toISOString().slice(0, 10);

  const diffClass = d => d <= 3 ? 'diff-easy' : d <= 6 ? 'diff-med' : 'diff-hard';
  const fmtTime = h => h >= 1000 ? `${Math.round(h/100)/10}k hrs` : h >= 100 ? `${Math.round(h)} hrs` : `${h} hrs`;
  const fmtCost = p => p === 0 ? 'Free' : p < 1000 ? `$${Math.round(p)}` : `$${(p/1000).toFixed(1)}k`;
  const rankLabel = (i) => {
    if (i === 0) return '<span class="goal-rank rank-1">#1</span>';
    if (i === 1) return '<span class="goal-rank rank-2">#2</span>';
    if (i === 2) return '<span class="goal-rank rank-3">#3</span>';
    return `<span class="goal-rank">#${i+1}</span>`;
  };

  const cards = data.priority_list.map((id, i) => {
    const g = goalsById[id];
    if (!g) return '';
    const diff = g.difficulty || '?';
    const dclass = typeof diff === 'number' ? diffClass(diff) : '';
    return `
      <div class="goal-priority-card">
        ${rankLabel(i)}
        <div class="goal-priority-info">
          <div class="goal-priority-name">${esc(g.title)}</div>
          <div class="goal-priority-area">${esc(g.area_name || '')}</div>
          ${g.reasoning ? `<div class="goal-priority-reasoning">${esc(g.reasoning)}</div>` : ''}
          <div class="goal-metrics">
            <div class="goal-metric ${dclass}">
              <span class="metric-icon">⚡</span>
              <span>Difficulty</span>
              <span class="metric-val">${diff}/10</span>
            </div>
            <div class="goal-metric">
              <span class="metric-icon">⏱</span>
              <span>Time</span>
              <span class="metric-val">${g.time_commitment_hours != null ? fmtTime(g.time_commitment_hours) : '—'}</span>
            </div>
            <div class="goal-metric">
              <span class="metric-icon">💰</span>
              <span>Cost</span>
              <span class="metric-val">${g.price_estimate != null ? fmtCost(g.price_estimate) : '—'}</span>
            </div>
            <div class="goal-metric">
              <span class="metric-icon">🎯</span>
              <span>Score</span>
              <span class="metric-val">${g.priority_score != null ? g.priority_score : '—'}/100</span>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="goal-analysis-panel">
      <div class="analysis-header">
        <span class="analysis-title">Priority Ranking</span>
        <span class="analysis-meta">${modeLabel} · updated ${today} · <a href="#" onclick="runGoalAnalysis();return false;">Refresh</a></span>
      </div>
      ${data.summary ? `<div class="analysis-summary">${esc(data.summary)}</div>` : ''}
      <div class="goal-priority-list">${cards}</div>
    </div>`;
}

              </div>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('')}`;
}

async function openMiscModal(editId) {
  let item = { life_area_id: '', name: '', status_id: statuses[0]?.id, category: '', link: '', notes: '' };
  if (editId) {
    const items = await getList('misc', 'Failed to load misc items', { toastOnError: false });
    item = items.find(m => m.id === editId) || item;
  }
  openModal(`
    <h3>${editId ? 'Edit' : 'Add'} Misc Item</h3>
    <form id="misc-form">
      <div class="form-row">
        <div class="form-group">
          <label>Life Area (optional)</label>
          <select name="life_area_id">
            <option value="">— None —</option>
            ${lifeAreas.map(a => `<option value="${a.id}" ${a.id === item.life_area_id ? 'selected' : ''}>${a.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status_id">${statuses.map(s =>
            `<option value="${s.id}" ${s.id === item.status_id ? 'selected' : ''}>${s.name} (${s.color})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group"><label>Name</label><input name="name" value="${esc(item.name || '')}" required></div>
      <div class="form-group"><label>Category</label><input name="category" value="${esc(item.category || '')}"></div>
      <div class="form-group"><label>Link</label><input name="link" value="${esc(item.link || '')}"></div>
      <div class="form-group"><label>Notes</label><textarea name="notes">${esc(item.notes || '')}</textarea></div>
    </form>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMiscItem(${editId || 'null'})">Save</button>
    </div>`);
}

async function saveMiscItem(id) {
  const data = getFormData('misc-form');
  data.status_id = Number(data.status_id);
  data.life_area_id = data.life_area_id ? Number(data.life_area_id) : null;
  let res;
  if (id) res = await api(`misc/${id}`, { method: 'PUT', body: data });
  else res = await api('misc', { method: 'POST', body: data });
  if (showApiError(res)) return;
  closeModal();
  toast(id ? 'Item updated' : 'Item added');
  loadPage('misc');
}

async function deleteMiscItem(id) {
  if (!confirm('Delete this item?')) return;
  const res = await api(`misc/${id}`, { method: 'DELETE' });
  if (showApiError(res)) return;
  toast('Item deleted');
  loadPage('misc');
}

// ── Utils ──
// ── Goal Archive ──
let _archiveFilter = 'all'; // 'all' | 'active' | 'completed'
let _todaySelectedArchiveIds = [];
let _todayOptimizedPlan = null;

function toggleTodayArchiveSelection(archiveId, checked) {
  const id = String(archiveId || '');
  if (!id) return;
  if (checked) {
    if (!_todaySelectedArchiveIds.includes(id)) _todaySelectedArchiveIds.push(id);
  } else {
    _todaySelectedArchiveIds = _todaySelectedArchiveIds.filter(x => x !== id);
  }
}

async function optimizeSelectedTodayGoals() {
  if (!_todaySelectedArchiveIds.length) {
    toast('Select at least one item first');
    return;
  }
  const now = nowInTZ();
  const res = await api('ai/today-plan', {
    method: 'POST',
    body: {
      now_iso: isoLocalForApi(now),
      timezone: getTimezone(),
      today_section_key: getTodayScheduleSectionKey(),
      end_hour: 22,
      selected_archive_ids: _todaySelectedArchiveIds,
    },
  });
  if (showApiError(res)) return;
  _todayOptimizedPlan = res;
  toast(`Optimized ${_todaySelectedArchiveIds.length} selected goal${_todaySelectedArchiveIds.length !== 1 ? 's' : ''}`);
  renderGoalArchive(document.getElementById('content'));
}

async function insertSelectedTodayGoalsIntoSchedule() {
  if (!_todaySelectedArchiveIds.length) {
    toast('Select at least one AI-picked item first');
    return;
  }
  const todaySectionKey = getTodayScheduleSectionKey();
  if (!todaySectionKey) {
    toast('Could not determine today\'s schedule section');
    return;
  }
  const res = await api('ai/today-plan/insert', {
    method: 'POST',
    body: {
      today_section_key: todaySectionKey,
      selected_archive_ids: _todaySelectedArchiveIds,
      recommendations: (_todayOptimizedPlan && Array.isArray(_todayOptimizedPlan.recommendations)) ? _todayOptimizedPlan.recommendations : [],
    },
  });
  if (showApiError(res)) return;
  toast(`Inserted ${Number(res.inserted_count || 0)} item${Number(res.inserted_count || 0) !== 1 ? 's' : ''} into today\'s schedule`);
  _todayOptimizedPlan = null;
  renderGoalArchive(document.getElementById('content'));
}

function resetTodayGoalOptimization() {
  _todayOptimizedPlan = null;
  renderGoalArchive(document.getElementById('content'));
}

async function removeScheduleEvent(sectionKey, itemId) {
  if (!confirm('Remove this event from today\'s schedule?')) return;
  const res = await api(`custom/${sectionKey}/${itemId}`, { method: 'DELETE' });
  if (showApiError(res)) return;
  toast('Event removed from schedule');
  _todayOptimizedPlan = null;
  renderGoalArchive(document.getElementById('content'));
}

async function markSessionDone(sectionKey, itemId) {
  const res = await api(`custom/${sectionKey}/${itemId}/session`, { method: 'PUT' });
  if (showApiError(res)) return;
  if (res.all_done) {
    toast(`All ${res.sessions_required} sessions completed!`);
  } else {
    toast(`Session ${res.sessions_completed}/${res.sessions_required} recorded`);
  }
  _todayOptimizedPlan = null;
  renderGoalArchive(document.getElementById('content'));
}

async function renderGoalArchive(c) {
  c.innerHTML = `<div class="page-header"><h2>Goal Archive</h2><button class="btn btn-primary" onclick="openGoalModal()">+ Add Goal</button></div><div class="analysis-loading"><span class="spin">⟳</span> Loading…</div>`;
  const entries = await fetch('/api/goals/archive').then(r => r.json()).catch(() => []);
  if (!Array.isArray(entries)) { c.innerHTML = '<div class="card">Failed to load goals.</div>'; return; }

  const TERMS = [
    { key: 'overdue', label: 'Overdue',     subtitle: 'Past target date' },
    { key: 'short',   label: 'Short-Term',  subtitle: 'Due within 3 months' },
    { key: 'medium',  label: 'Medium-Term', subtitle: 'Due within 1 year' },
    { key: 'long',    label: 'Long-Term',   subtitle: 'Over 1 year away or undated' },
  ];

  function filterGoals(list) {
    if (_archiveFilter === 'today') {
      const today = new Date().toISOString().slice(0, 10);
      return list.filter(g => isTodayItem(g, today));
    }
    if (_archiveFilter === 'active') return list.filter(g => !g.is_completed);
    if (_archiveFilter === 'completed') return list.filter(g => g.is_completed);
    return list;
  }

  function isTodayItem(g, today) {
    // Locked LTOs (prerequisite not done) are never eligible for today
    if (Number(g.is_locked || 0) === 1) return false;
    const target = (g.target_date || '').slice(0, 10);
    if (target) {
      if (target <= today && !g.is_completed) return true; // overdue + due today
      if (target === today) return true;
    }
    if (g.source_type === 'custom_item' && g.item_kind === 'task' && !g.is_completed) return true;
    if (g.source_type === 'custom_item' && g.item_kind === 'long_term_objective' && !g.is_completed) return true;
    return false;
  }

  function parse12hToMin(t) {
    if (!t) return null;
    const m = String(t).trim().toUpperCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/);
    if (!m) return null;
    let h = Number(m[1]);
    const mm = Number(m[2] || 0);
    const ap = m[3];
    if (ap === 'PM' && h !== 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
    return h * 60 + mm;
  }

  function estimateGoalSessionMinutes(g) {
    const hours = Number(g.time_commitment_hours || 0);
    if (hours > 0) return Math.max(25, Math.min(120, Math.round((hours * 60) / 20)));
    const d = Number(g.difficulty || 0);
    if (d >= 8) return 75;
    if (d >= 5) return 55;
    if (d >= 3) return 40;
    return 30;
  }

  function goalOpportunityScore(g, today) {
    const ai = Number(g.ai_priority_score || 0);
    const p = Number(g.priority || 0);
    const d = Number(g.difficulty || 0);
    const target = (g.target_date || '').slice(0, 10);
    let dueBoost = 0;
    if (target) {
      if (target < today) dueBoost = 35;
      else if (target === today) dueBoost = 28;
      else if (target <= new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10)) dueBoost = 12;
    }
    const base = ai > 0 ? ai : (p * 30 + dueBoost);
    return base - (d * 1.2);
  }

  async function buildPage() {
    const filtered = filterGoals(entries);
    const totalActive = entries.filter(g => !g.is_completed).length;
    const totalDone = entries.filter(g => g.is_completed).length;
    const todayIso = isoLocalForApi(nowInTZ()).slice(0, 10);
    const totalToday = entries.filter(g => isTodayItem(g, todayIso)).length;

    const filterBar = `
      <div class="archive-filters">
        <span style="font-size:12px;color:var(--text-muted)">Show:</span>
        ${['today','all','active','completed'].map(f => `
          <span class="filter-chip ${_archiveFilter === f ? 'active' : ''}" onclick="setArchiveFilter('${f}')">${
            f === 'today' ? `Today (${totalToday})` : f === 'all' ? `All (${entries.length})` : f === 'active' ? `Active (${totalActive})` : `Completed (${totalDone})`
          }</span>`).join('')}
      </div>`;

    let todayPlanRes = null;
    if (_archiveFilter === 'today') {
      if (_todayOptimizedPlan && !apiHasError(_todayOptimizedPlan)) {
        todayPlanRes = _todayOptimizedPlan;
      } else {
        const now = nowInTZ();
        todayPlanRes = await api('ai/today-plan', {
          method: 'POST',
          body: {
            now_iso: isoLocalForApi(now),
            timezone: getTimezone(),
            today_section_key: getTodayScheduleSectionKey(),
            end_hour: 22,
          },
        });
      }
    }

    const todaySchedule = (todayPlanRes && !apiHasError(todayPlanRes) && Array.isArray(todayPlanRes.schedule))
      ? todayPlanRes.schedule
      : [];
    const recommendedGoals = (todayPlanRes && !apiHasError(todayPlanRes) && Array.isArray(todayPlanRes.recommendations))
      ? todayPlanRes.recommendations
      : [];
    const freeMinutes = Number(todayPlanRes?.free_minutes || 0);
    const candidatesConsidered = Number(todayPlanRes?.candidates_considered || 0);
    const selectedCandidates = Number(todayPlanRes?.selected_candidates || 0);
    const planSummary = String(todayPlanRes?.summary || '');

    const recommendedIds = new Set(recommendedGoals.map(g => String(g.archive_id || '')));

    const selectableGoals = entries
      .filter(g => !g.is_completed)
      .filter(g => Number(g.is_locked || 0) !== 1)
      .filter(g => !recommendedIds.has(String(g.archive_id || '')))
      .filter(g => !(g.source_type === 'custom_item' && Number(g.is_schedule_section || 0) === 1))
      .filter(g => ['goal', 'task', 'goal_item', 'long_term_objective'].includes(String(g.item_kind || '')) || ['goal', 'task', 'custom_item'].includes(String(g.source_type || '')))
      .map(g => ({ ...g, _score: goalOpportunityScore(g, todayIso), _mins: estimateGoalSessionMinutes(g) }))
      .sort((a, b) => b._score - a._score)
      .slice(0, 14);

    // Keep selection valid against currently available goals.
    const selectableIds = new Set(selectableGoals.map(g => String(g.archive_id || '')));
    _todaySelectedArchiveIds = _todaySelectedArchiveIds.filter(id => selectableIds.has(id));

    const selectableGoalCards = selectableGoals.map(g => {
      const aid = String(g.archive_id || '');
      const checked = _todaySelectedArchiveIds.includes(aid);
      const kindLabel = g.item_kind === 'long_term_objective' ? 'Long-Term Objective' : (g.item_kind === 'task' ? 'Task' : 'Goal');
      const sessReq = Number(g.sessions_required || 0);
      return `
        <label class="archive-goal-card" style="cursor:pointer;align-items:center" for="goal-pick-${esc(aid)}">
          <input id="goal-pick-${esc(aid)}" class="goal-picker-check" type="checkbox" ${checked ? 'checked' : ''}
            onchange="toggleTodayArchiveSelection('${esc(aid)}', this.checked)">
          <div class="agc-body">
            <div class="agc-title">${esc(g.title)}</div>
            <div class="agc-tags">
              <span class="agc-tag area">${esc(g.area_name || '')}</span>
              <span class="agc-tag">${kindLabel}</span>
              ${sessReq > 1 ? `<span class="agc-tag" style="color:#38ada9">📅 ${sessReq} sessions</span>` : ''}
              <span class="agc-tag">~${Math.round(Number(g._mins || 0))} min</span>
              <span class="agc-tag">score ${Math.round(Number(g._score || 0))}</span>
            </div>
          </div>
        </label>`;
    }).join('');

    const scheduleCards = todaySchedule.map(g => {
      const sectionKeyArg = JSON.stringify(String(g.section_key || ''));
      const itemId = g.id;
      const sessReq = Number(g.sessions_required || g.task_count || 0);
      const sessDone = Number(g.sessions_completed || 0);
      const hasSessionTracking = sessReq > 0;
      const pct = hasSessionTracking ? Math.min(100, Math.round((sessDone / sessReq) * 100)) : 0;
      const sessionBar = hasSessionTracking ? `
        <div class="schedule-session-progress">
          <span class="session-text">${sessDone}/${sessReq} sessions</span>
          <div class="session-bar"><div class="session-bar-fill" style="width:${pct}%"></div></div>
          ${sessDone < sessReq ? `<button class="session-done-btn" onclick="event.stopPropagation(); markSessionDone(${sectionKeyArg}, ${itemId})">+1 Session</button>` : '<span class="session-text" style="color:var(--green)">✓ Done</span>'}
        </div>` : '';
      return `
        <div class="archive-goal-card ${g.is_completed ? 'completed-card' : ''}" id="sched-card-${itemId}">
          <div class="agc-status" style="background:var(--blue)"></div>
          <div class="agc-body">
            <div class="agc-title ${g.is_completed ? 'done' : ''}">${esc(g.name || g.title || '')}</div>
            <div class="agc-tags">
              <span class="agc-tag area">${esc(g.section_label || g.area_name || '')}</span>
              ${g.task_time ? `<span class="agc-tag">🕒 ${esc(g.task_time)}</span>` : `<span class="agc-tag">Unscheduled</span>`}
              ${g.task_interval ? `<span class="agc-tag">${esc(g.task_interval)}</span>` : ''}
              ${g.subgroup ? `<span class="agc-tag">${esc(g.subgroup)}</span>` : ''}
              ${hasSessionTracking ? `<span class="agc-tag" style="color:#38ada9">📅 ${sessReq} sessions</span>` : ''}
            </div>
            ${sessionBar}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
            <button class="btn-icon" onclick='loadPage(${sectionKeyArg})' title="Open section">↗</button>
            <button class="btn-icon btn-danger" onclick='removeScheduleEvent(${sectionKeyArg}, ${itemId})' title="Remove from schedule">✕</button>
          </div>
        </div>`;
    }).join('');

    const goalCards = recommendedGoals.map(g => {
      const dueToday = g.target_date && String(g.target_date).slice(0, 10) === todayIso;
      const overdue = g.target_date && String(g.target_date).slice(0, 10) < todayIso;
      const reason = g.reason || g.ai_reasoning || '';
      const isEditableGoal = g.source_type === 'goal';
      const archiveId = String(g.archive_id || '');
      const isSelectable = !!archiveId;
      const kindLabel = g.item_kind === 'long_term_objective' ? 'Long-Term Objective' : (g.item_kind === 'task' ? 'Task' : 'Goal');
      const archiveIdArg = JSON.stringify(archiveId);
      const selected = _todaySelectedArchiveIds.includes(archiveId);
      const sectionKeyArg = JSON.stringify(String(g.section_key || ''));
      return `
        <div class="archive-goal-card">
          <div class="agc-status" style="background:var(--orange)"></div>
          <div class="agc-body">
            <div class="agc-title">${esc(g.title)}</div>
            ${g.description ? `<div class="agc-desc">${esc(g.description)}</div>` : ''}
            <div class="agc-tags">
              <span class="agc-tag area">${esc(g.area_name || '')}</span>
              <span class="agc-tag">${kindLabel}</span>
              <span class="agc-tag">~${Math.round(Number(g.planned_minutes || 0))} min block</span>
              ${g.score != null ? `<span class="agc-tag">score ${Math.round(Number(g.score || 0))}</span>` : ''}
              ${(g.planned_start && g.planned_end) ? `<span class="agc-tag">🕒 ${esc(g.planned_start)} - ${esc(g.planned_end)}</span>` : ''}
              ${g.target_date ? `<span class="agc-tag date ${overdue ? 'overdue' : ''}">📅 ${esc(g.target_date)}${dueToday ? ' (today)' : (overdue ? ' ⚠' : '')}</span>` : ''}
              ${isSelectable ? `<label class="goal-select-inline ${selected ? 'selected' : ''}"><input type="checkbox" ${selected ? 'checked' : ''} onchange='toggleTodayArchiveSelection(${archiveIdArg}, this.checked)'>Insert today</label>` : ''}
            </div>
            ${reason ? `<div class="today-goal-score" style="margin-top:6px">${esc(reason)}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
            ${isEditableGoal ? `
              <button class="btn-icon" onclick="openGoalModal(${g.id})" title="Edit">✎</button>
              <button class="btn-icon btn-danger" onclick="archiveToggleGoal(${g.id},1)" title="Complete">✓</button>
            ` : ''}
            ${(!isEditableGoal && g.section_key) ? `
              <button class="btn-icon" onclick='loadPage(${sectionKeyArg})' title="Open section">↗</button>
            ` : ''}
          </div>
        </div>`;
    }).join('');

    const sections = TERMS.map(t => {
      const termGoals = filtered.filter(g => g.term === t.key);
      if (termGoals.length === 0) return '';
      const today = new Date().toISOString().slice(0,10);

      const cards = termGoals.map(g => {
        const statusColor = g.is_completed ? 'var(--green)' : (g.priority === 2 ? 'var(--red)' : g.priority === 1 ? 'var(--orange)' : 'var(--blue)');
        const priorityText = g.priority === 2 ? 'High' : g.priority === 1 ? 'Medium' : 'Low';
        const kindLabel = g.item_kind === 'long_term_objective' ? 'Long-Term Objective' : (g.item_kind === 'task' ? 'Task' : 'Goal');
        const isEditableGoal = g.source_type === 'goal';
        const archiveId = String(g.archive_id || '');
        const archiveIdArg = JSON.stringify(archiveId);
        const selected = _todaySelectedArchiveIds.includes(archiveId);
        const isOverdue = g.target_date && g.target_date < today && !g.is_completed;
        const sourceLabel = g.source_type === 'custom_item' ? 'Custom Section' : (g.source_type === 'task' ? 'Goal Task' : 'Goal');
        const sectionKeyArg = JSON.stringify(String(g.section_key || ''));
        return `
          <div class="archive-goal-card ${g.is_completed ? 'completed-card' : ''}">
            <div class="agc-status" style="background:${statusColor}"></div>
            <div class="agc-body">
              <div class="agc-title ${g.is_completed ? 'done' : ''}">${esc(g.title)}</div>
              ${g.description ? `<div class="agc-desc">${esc(g.description)}</div>` : ''}
              <div class="agc-tags">
                <span class="agc-tag area">${esc(g.area_name || '')}</span>
                <span class="agc-tag">${kindLabel}</span>
                <span class="agc-tag">${sourceLabel}</span>
                <span class="agc-tag">is_goal: ${g.is_goal ? 'yes' : 'no'}</span>
                <span class="agc-tag">${priorityText} priority</span>
                ${g.target_date ? `<span class="agc-tag date ${isOverdue ? 'overdue' : ''}">📅 ${esc(g.target_date)}${isOverdue ? ' ⚠' : ''}</span>` : ''}
                ${g.is_completed ? `<span class="agc-tag" style="color:var(--green);border-color:rgba(63,185,80,0.3)">✓ Done</span>` : ''}
                ${(isEditableGoal && !g.is_completed) ? `<label class="goal-select-inline ${selected ? 'selected' : ''}"><input type="checkbox" ${selected ? 'checked' : ''} onchange='toggleTodayArchiveSelection(${archiveIdArg}, this.checked)'>Pick today</label>` : ''}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
              ${isEditableGoal ? `
                <button class="btn-icon" onclick="openGoalModal(${g.id})" title="Edit">✎</button>
                <button class="btn-icon ${g.is_completed ? '' : 'btn-danger'}" onclick="archiveToggleGoal(${g.id},${g.is_completed ? 0 : 1})" title="${g.is_completed ? 'Reopen' : 'Complete'}">
                  ${g.is_completed ? '↩' : '✓'}
                </button>
              ` : ''}
              ${(!isEditableGoal && g.section_key) ? `
                <button class="btn-icon" onclick='loadPage(${sectionKeyArg})' title="Open section">↗</button>
              ` : ''}
            </div>
          </div>`;
      }).join('');

      return `
        <div class="term-section">
          <div class="term-header">
            <span class="term-badge ${t.key}">${t.label}</span>
            <span class="term-subtitle">${t.subtitle}</span>
            <span class="term-count">${termGoals.length} item${termGoals.length !== 1 ? 's' : ''}</span>
          </div>
          ${cards}
        </div>`;
    }).join('');

    const isEmpty = filtered.length === 0;

    c.innerHTML = `
      <div class="page-header">
        <h2>Goal Archive</h2>
        <button class="btn btn-primary" onclick="openGoalModal()">+ Add Goal</button>
      </div>
      ${filterBar}
      ${isEmpty ? '<div class="card"><div class="archive-empty">No goals match this filter.</div></div>' : (_archiveFilter === 'today'
        ? `<div class="term-section">
             <div class="term-header">
               <span class="term-badge short">Today Plan</span>
               <span class="term-subtitle">Live schedule + AI-selected archive tasks/goals that fit your remaining day</span>
               <span class="term-count">${todayIso}</span>
             </div>
             <div class="today-stats">
               <span class="today-stat">Now: ${formatLiveClock()}</span>
               <span class="today-stat">Schedule tasks: ${todaySchedule.length}</span>
               <span class="today-stat">Candidates checked: ${candidatesConsidered}</span>
               <span class="today-stat">Selected: ${selectedCandidates || _todaySelectedArchiveIds.length}</span>
               <span class="today-stat">Free time detected: ${Math.floor(freeMinutes / 60)}h ${freeMinutes % 60}m</span>
               <span class="today-stat">AI picks: ${recommendedGoals.length}</span>
             </div>
             ${planSummary ? `<div class="today-meta" style="margin-bottom:12px">${esc(planSummary)}</div>` : ''}
             <div class="today-combo">
               <div class="today-col">
                 <h4>Today's Schedule</h4>
                 <div class="today-meta">Tasks from schedule-enabled sections${todaySchedule.length ? '' : ' (none yet)'}</div>
                 ${todaySchedule.length ? scheduleCards : '<div class="archive-empty">No scheduled tasks for today.</div>'}
               </div>
               <div class="today-col">
                 <h4>Top Goals You Can Fit Today</h4>
                 <div class="today-meta">Pick archive items below, run AI optimization, then insert selected AI picks into today\'s schedule</div>
                 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
                   <button class="btn btn-primary" onclick="optimizeSelectedTodayGoals()">Optimize Selected Goals</button>
                   <button class="btn" onclick="insertSelectedTodayGoalsIntoSchedule()">Insert Selected Into Schedule</button>

// ── Timezone Setting ──
const defaultTZ = 'America/New_York';
function getTimezone() { return localStorage.getItem('lifeopt_tz') || defaultTZ; }
function setTimezone(tz) { localStorage.setItem('lifeopt_tz', tz); }
function nowInTZ() {
  const tz = getTimezone();
  const s = new Date().toLocaleString('en-US', { timeZone: tz });
  return new Date(s);
}
function isoLocalForApi(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return `${y}-${m}-${day}T${hh}:${mm}:${ss}`;
}
function getTodayScheduleSectionKey() {
  const dayMap = {
    0: 'custom_weekend_routine',
    1: 'custom_mwf_routine',
    2: 'custom_tuth_routine',
    3: 'custom_wed_routine',
    4: 'custom_thu_routine',
    5: 'custom_mwf_routine',
    6: 'custom_weekend_routine',
  };
  const now = nowInTZ();
  return dayMap[now.getDay()] || '';
}

// ── Live Clock ──
function formatLiveClock() {
  const now = nowInTZ();
  const h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  const mm = m.toString().padStart(2, '0');
  return `${h12}:${mm} ${ampm}`;
}
function formatLiveDate() {
  return new Date().toLocaleDateString('en-US', { timeZone: getTimezone(), weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function parseTimeToMin(t) {
  if (!t) return null;
  t = t.trim().toUpperCase();
  const parts = t.replace('AM','').replace('PM','').trim().split(':');
  let h = parseInt(parts[0]);
  const m = parts.length > 1 ? parseInt(parts[1]) : 0;
  if (isNaN(h)) return null;
  if (t.includes('PM') && h !== 12) h += 12;
  if (t.includes('AM') && h === 12) h = 0;
  return h * 60 + m;
}
function getCurrentTaskIdx(tasks) {
  const now = nowInTZ();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let current = -1;
  for (let i = 0; i < tasks.length; i++) {
    const tMin = parseTimeToMin(tasks[i].task_time);
    if (tMin !== null && tMin <= nowMin) current = i;
  }
  return current;
}

// ── Early Complete / Downtime ──
function htlDateKey() {
  const d = nowInTZ();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getEarlyCompletes() {

function setEarlyComplete(taskId) {

}
function getSkips() {

}
function setSkip(taskId) {

  const weekKey = `week-${start.getFullYear()}-${start.getMonth()}-${start.getDate()}`;
  if (!store[weekKey]) store[weekKey] = {};
  if (checked) store[weekKey][`${dayIdx}-${taskId}`] = true;
  else delete store[weekKey][`${dayIdx}-${taskId}`];

  Object.keys(store).forEach(k => { if (k !== weekKey) delete store[k]; });
  localStorage.setItem('weekChecks', JSON.stringify(store));
  loadPage('schedule');
}

async function renderSchedule(c) {
  const tasks = await getList('schedule', 'Failed to load schedule');
  const scheduleSections = sidebarSections.filter(s => s.is_schedule);

  const intervals = [
    { key: 'daily', label: 'Daily', icon: '☀️' },
    { key: 'every other day', label: 'Every Other Day', icon: '🔄' },
    { key: 'weekly', label: 'Weekly', icon: '📆' },
    { key: 'biweekly', label: 'Biweekly', icon: '📅' },
    { key: 'monthly', label: 'Monthly', icon: '🗓' },
    { key: 'yearly', label: 'Yearly', icon: '📋' },
    { key: 'as needed', label: 'As Needed', icon: '⚡' },
    { key: 'none', label: 'Unscheduled', icon: '📌' },
  ];

  // Group by interval
  const byInterval = {};
  intervals.forEach(i => byInterval[i.key] = []);
  tasks.forEach(t => {
    const key = (t.task_interval || 'none').toLowerCase();
    if (byInterval[key]) byInterval[key].push(t);
    else byInterval['none'].push(t);
  });

  // Group by section (routine), sorted by task time
  const bySection = {};
  scheduleSections.forEach(s => bySection[s.page_key] = { label: s.label, tasks: [] });
  tasks.forEach(t => {
    if (bySection[t.section_key]) bySection[t.section_key].tasks.push(t);
  });
  // Sort each section's tasks by sort_order then task_time
  Object.values(bySection).forEach(s => {
    s.tasks.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  });

  function groupBySubgroup(taskList) {
    const groups = [];
    const seen = {};
    taskList.forEach(t => {
      const key = t.subgroup || '__none__';
      if (!seen[key]) { seen[key] = { label: t.subgroup, tasks: [] }; groups.push(seen[key]); }
      seen[key].tasks.push(t);
    });
    return groups;
  }

  function renderTask(t, showSection) {
    const isQO = t.is_quick_objective;
    const sessReq = Number(t.sessions_required || t.task_count || 0);
    const sessDone = Number(t.sessions_completed || 0);
    const hasSessionTracking = sessReq > 0;
    const pct = hasSessionTracking ? Math.min(100, Math.round((sessDone / sessReq) * 100)) : 0;
    return `<div class="schedule-task ${isQO ? 'schedule-task-qo' : ''}">
      ${statusDot(t.status_color)}
      <div class="schedule-task-info">
        <div class="schedule-task-name">${esc(t.name)}${isQO ? ' <span class="qo-badge-sm">QO</span>' : ''}</div>
        ${t.notes ? `<div class="schedule-task-meta">${esc(t.notes).substring(0, 80)}${t.notes.length > 80 ? '…' : ''}</div>` : ''}
        ${hasSessionTracking ? `<div class="schedule-session-progress">
          <span class="session-text">${sessDone}/${sessReq} sessions</span>
          <div class="session-bar"><div class="session-bar-fill" style="width:${pct}%"></div></div>
          ${sessDone < sessReq ? `<button class="session-done-btn" onclick="event.stopPropagation(); markScheduleSession('${esc(t.section_key)}', ${t.id})">+1</button>` : '<span class="session-text" style="color:var(--green)">✓</span>'}
        </div>` : ''}
      </div>
      ${isQO ? '<span class="schedule-task-time" style="font-style:italic;opacity:0.6">anytime</span>' : (t.task_time ? `<span class="schedule-task-time">${esc(t.task_time)}</span>` : '')}
      ${!hasSessionTracking && t.task_count ? `<span class="schedule-task-time">${t.task_count}×</span>` : ''}
      ${showSection ? `<span class="schedule-task-section">${esc(t.section_label)}</span>` : ''}
      <div class="schedule-task-actions">
        <button class="btn-icon" onclick="openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})" title="Edit task">✎</button>
        <button class="btn-icon" onclick="navigateTo('${esc(t.section_key)}')" title="Open section">↗</button>
      </div>
    </div>`;
  }

  function renderSubgroupedTasks(taskList, showSection) {
    const sg = groupBySubgroup(taskList);
    const hasAnySubgroup = sg.some(g => g.label);
    if (!hasAnySubgroup) return taskList.map(t => renderTask(t, showSection)).join('');
    return sg.map(g => `
      ${subgroupHeader(g.label)}
      ${g.tasks.map(t => renderTask(t, showSection)).join('')}
    `).join('');
  }

  function renderByRoutine() {
    const entries = Object.entries(bySection).filter(([_, s]) => s.tasks.length > 0);
    if (entries.length === 0) return '<div class="card"><div class="empty-state">No tasks found.</div></div>';
    return `<div class="schedule-grid">${entries.map(([key, s]) => `
      <div class="schedule-column">
        <div class="schedule-column-header">
          <span>📋</span> ${esc(s.label)}
          <span class="col-count">${s.tasks.length}</span>
        </div>
        ${renderSubgroupedTasks(s.tasks, false)}
      </div>
    `).join('')}</div>`;
  }

  function renderByInterval() {
    const visible = scheduleView === 'all'
      ? intervals
      : intervals.filter(i => i.key === scheduleView);
    return `<div class="schedule-grid">${visible.filter(i => byInterval[i.key].length > 0).map(i => `
      <div class="schedule-column">
        <div class="schedule-column-header">
          <span>${i.icon}</span> ${i.label}
          <span class="col-count">${byInterval[i.key].length}</span>
        </div>
        ${renderSubgroupedTasks(byInterval[i.key], true)}
      </div>
    `).join('')}</div>`;
  }

  function renderTimeline() {
    const entries = Object.entries(bySection).filter(([_, s]) => s.tasks.length > 0);
    if (entries.length === 0) return '<div class="card"><div class="empty-state">No tasks found.</div></div>';
    const todayDayMap = {
      0: 'custom_weekend_routine', 1: 'custom_mwf_routine', 2: 'custom_tuth_routine',
      3: 'custom_wed_routine', 4: 'custom_thu_routine', 5: 'custom_mwf_routine', 6: 'custom_weekend_routine'
    };
    const now = nowInTZ();
    const todayKey = todayDayMap[now.getDay()];

    // Default to today's routine
    const todayEntryIdx = entries.findIndex(([key]) => key === todayKey);
    if (tlCarouselStart === 0 && todayEntryIdx >= 0) tlCarouselStart = todayEntryIdx;
    const maxIdx = entries.length - 1;
    const idx = Math.min(tlCarouselStart, maxIdx);
    const [key, s] = entries[idx];
    const isToday = key === todayKey;
    const allTasks = s.tasks;
    const currentIdx = isToday ? getCurrentTaskIdx(allTasks) : -1;

    const sgColor = (t) => t.subgroup ? subgroupColor(t.subgroup) : 'var(--border)';
    const earlyCompletes = isToday ? getEarlyCompletes() : {};
    const skips = isToday ? getSkips() : {};
    const nowMin = (() => { const n = nowInTZ(); return n.getHours() * 60 + n.getMinutes(); })();

    const taskCards = allTasks.map((t, ti) => {
      const isPast = isToday && ti < currentIdx;
      const isCurrent = isToday && ti === currentIdx;
      const isNext = isToday && ti === currentIdx + 1;
      const isFuture = isToday && currentIdx >= 0 && ti > currentIdx + 1;
      const tid = String(t.id);
      const earlyDone = !!earlyCompletes[tid];
      const skipped = !!skips[tid];

      // Determine if this task has downtime (completed early, next task hasn't started yet)
      let hasDowntime = false;
      let downtimeMin = 0;
      if (earlyDone && !skipped && ti < allTasks.length - 1) {
        const nextTime = parseTimeToMin(allTasks[ti + 1].task_time);
        if (nextTime !== null && nextTime > nowMin) {
          hasDowntime = true;
          downtimeMin = nextTime - nowMin;
        }
      }

      const stateClass = earlyDone ? 'htl-done' : (isPast ? 'htl-past' : isCurrent ? 'htl-active' : isNext ? 'htl-upcoming' : (isFuture ? 'htl-future' : ''));
      const isEffectivelyCurrent = isCurrent && !earlyDone;
      const railGlow = isEffectivelyCurrent ? 'htl-rail-glow' : '';

      // Build rail: downtime rail or normal rail
      let rail = '';
      if (ti < allTasks.length - 1) {
        if (hasDowntime) {
          const dm = Math.floor(downtimeMin);
          const ds = Math.floor((downtimeMin - dm) * 60);
          rail = `<div class="htl-rail-downtime">
            <div class="htl-rail-line-red"></div>
            <div class="htl-downtime-info">
              <div class="htl-downtime-label">down time</div>
              <div class="htl-downtime-timer" data-htl-countdown="${parseTimeToMin(allTasks[ti+1].task_time)}">${dm}m</div>
              <button class="htl-skip-btn" onclick="htlSkipDowntime('${tid}')">Skip ›</button>
            </div>
          </div>`;
        } else {
          rail = `<div class="htl-rail ${railGlow}"><div class="htl-rail-line"></div></div>`;
        }
      }

      // Show complete button on current task (not already done)
      const showComplete = isEffectivelyCurrent;

      return `<div class="htl-node ${stateClass}" ${isEffectivelyCurrent ? 'data-htl-current' : ''}>
        <div class="htl-card" style="--sg-color:${sgColor(t)}">
          <div class="htl-dot-wrap">
            <div class="timeline-dot ${isEffectivelyCurrent ? 'tl-dot-glow' : ''}" style="background:${isEffectivelyCurrent ? 'var(--accent)' : earlyDone ? 'var(--green)' : sgColor(t)}"></div>
          </div>
          <div class="htl-time">${esc(t.task_time || '')}</div>
          <div class="htl-name">${esc(t.name)}</div>
          ${isEffectivelyCurrent ? '<div class="htl-badge"><span class="week-now-indicator">NOW</span></div>' : ''}
          ${isNext && !earlyDone ? '<div class="htl-badge"><span class="week-next-indicator">NEXT</span></div>' : ''}
          ${earlyDone ? '<div class="htl-badge" style="color:var(--green);font-size:10px;font-weight:600">✓ Done</div>' : ''}
          ${t.subgroup ? `<div class="htl-sg" style="color:${sgColor(t)}">${esc(t.subgroup)}</div>` : ''}
          ${showComplete ? `<button class="htl-complete-btn" onclick="htlCompleteEarly('${tid}')">Complete ✓</button>` : ''}
          <button class="htl-edit-btn" onclick="openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})">Edit</button>
        </div>
      </div>${rail}`;
    }).join('');

    const dots = entries.map((_, p) =>
      `<div class="week-nav-dot ${p === idx ? 'active' : ''}" onclick="jumpTlCarousel(${p})"></div>`
    ).join('');

    return `
      <div class="week-carousel" style="align-items:center">
        <button class="week-arrow" onclick="shiftTlCarousel(-1,${maxIdx})" ${idx <= 0 ? 'disabled' : ''}>‹</button>
        <div style="flex:1;min-width:0;text-align:center">
          <h3 style="margin-bottom:4px">📋 ${esc(s.label)}${isToday ? ' <span class="week-today-badge">Today</span>' : ''}</h3>
        </div>
        <button class="week-arrow" onclick="shiftTlCarousel(1,${maxIdx})" ${idx >= maxIdx ? 'disabled' : ''}>›</button>
      </div>
      <div class="week-nav-dots" style="margin-bottom:16px">${dots}</div>
      <div class="htl-scroll" id="htl-scroll-container">
        <div class="htl-track">${taskCards}</div>
      </div>`;
  }

  // Auto-scroll timeline to current task after render
  function htlAutoScroll() {
    const container = document.getElementById('htl-scroll-container');
    const cur = container && container.querySelector('[data-htl-current]');
    if (container && cur) {
      const offset = cur.offsetLeft - container.offsetWidth / 2 + cur.offsetWidth / 2;
      container.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
    }
  }

  // ── Week Overview helpers ──
  const dayRoutineMap = {
    0: 'custom_weekend_routine',  // Sunday
    1: 'custom_mwf_routine',     // Monday
    2: 'custom_tuth_routine',    // Tuesday
    3: 'custom_wed_routine',     // Wednesday
    4: 'custom_thu_routine',     // Thursday
    5: 'custom_mwf_routine',     // Friday
    6: 'custom_weekend_routine', // Saturday
  };
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function getWeekKey() {
    const now = new Date();
    const start = new Date(now);
    start.setDate(now.getDate() - now.getDay());
    return `week-${start.getFullYear()}-${start.getMonth()}-${start.getDate()}`;
  }

  function isTaskChecked(dayIdx, taskId) {
    const store = JSON.parse(localStorage.getItem('weekChecks') || '{}');
    return !!(store[getWeekKey()] && store[getWeekKey()][`${dayIdx}-${taskId}`]);
  }

  function renderWeekOverview() {
    const today = nowInTZ();
    const todayIdx = today.getDay();
    const nowMin = today.getHours() * 60 + today.getMinutes();
    const weekKey = getWeekKey();
    const store = JSON.parse(localStorage.getItem('weekChecks') || '{}');
    const weekData = store[weekKey] || {};

    const visibleDays = dayNames.slice(weekCarouselStart, weekCarouselStart + 3);
    const visibleIndices = [weekCarouselStart, weekCarouselStart + 1, weekCarouselStart + 2].filter(i => i < 7);

    const cards = visibleIndices.map(idx => {
      const day = dayNames[idx];
      const routineKey = dayRoutineMap[idx];
      const section = bySection[routineKey];
      const dayTasks = section ? section.tasks : [];
      const isToday = idx === todayIdx;
      const checkedCount = dayTasks.filter(t => weekData[`${idx}-${t.id}`]).length;
      const pct = dayTasks.length ? Math.round(checkedCount / dayTasks.length * 100) : 0;
      const sg = groupBySubgroup(dayTasks);
      const currentIdx = isToday ? getCurrentTaskIdx(dayTasks) : -1;
      const nextIdx = currentIdx + 1 < dayTasks.length ? currentIdx + 1 : -1;

      return `
      <div class="week-day-card ${isToday ? 'week-day-today' : ''}">
        <div class="week-day-header">
          <span class="week-day-name">${day}${isToday ? ' <span class="week-today-badge">Today</span>' : ''}</span>
          <span class="week-day-progress">${checkedCount}/${dayTasks.length} <span class="week-pct">${pct}%</span></span>
        </div>
        <div class="week-day-bar"><div class="week-day-bar-fill" style="width:${pct}%"></div></div>
        <div class="week-day-tasks">
          ${sg.map(g => {
            return `
            ${g.label ? `<div class="week-subgroup-header" style="color:${subgroupColor(g.label)}"><span class="subgroup-dot" style="background:${subgroupColor(g.label)}"></span>${esc(g.label)}</div>` : ''}
            ${g.tasks.map(t => {
              const checked = weekData[`${idx}-${t.id}`];
              const globalIdx = dayTasks.indexOf(t);
              const isCurrent = isToday && globalIdx === currentIdx;
              const isNext = isToday && globalIdx === nextIdx;
              const tMin = parseTimeToMin(t.task_time);
              const isPast = isToday && tMin !== null && tMin < nowMin && !isCurrent;
              return `<label class="week-task-row ${checked ? 'week-task-done' : ''} ${isCurrent ? 'week-task-current' : ''} ${isNext ? 'week-task-next' : ''} ${isPast && !checked ? 'week-task-past' : ''}">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleWeekTask(${idx},${t.id},this.checked)">
                <span class="week-task-time">${esc(t.task_time || '')}</span>
                <span class="week-task-name">${esc(t.name)}</span>
                ${isCurrent ? '<span class="week-now-indicator">NOW</span>' : ''}
                ${isNext ? '<span class="week-next-indicator">NEXT</span>' : ''}
                <button type="button" class="btn-icon week-edit-btn" onclick="event.preventDefault();event.stopPropagation();openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})" title="Edit task">✎</button>
              </label>`;
            }).join('')}`;
          }).join('')}
          ${dayTasks.length === 0 ? '<div style="color:var(--text-muted);padding:8px;font-size:12px">No tasks</div>' : ''}
        </div>
      </div>`;
    }).join('');

    const dots = [0,1,2,3,4].map(p =>
      `<div class="week-nav-dot ${p === weekCarouselStart ? 'active' : ''}" onclick="jumpWeekCarousel(${p})"></div>`
    ).join('');

    return `
      <div class="week-carousel">
        <button class="week-arrow" onclick="shiftWeekCarousel(-1)" ${weekCarouselStart <= 0 ? 'disabled' : ''}>‹</button>
        <div class="week-overview">${cards}</div>
        <button class="week-arrow" onclick="shiftWeekCarousel(1)" ${weekCarouselStart >= 4 ? 'disabled' : ''}>›</button>
      </div>
      <div class="week-nav-dots">${dots}</div>`;
  }

  const isIntervalTab = scheduleView !== 'by-routine' && scheduleView !== 'timeline' && scheduleView !== 'week';

  c.innerHTML = `
    <div class="page-header">
      <div>
        <h2>📅 Master Schedule</h2>
        <span style="color:var(--text-muted);font-size:13px">${tasks.length} task${tasks.length !== 1 ? 's' : ''} across ${scheduleSections.length} schedule${scheduleSections.length !== 1 ? 's' : ''}</span>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="openAiOptimizeModal()">AI Optimize Tasks</button>
          <button class="btn" onclick="openAiRoutineModal()">AI Build Routine</button>
        </div>
      </div>
      <div class="live-clock-box">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <div id="live-clock" class="live-clock">${formatLiveClock()}</div>
          <button class="btn-icon tz-btn" onclick="openTimezoneModal()" title="Timezone settings">⚙️</button>
        </div>
        <div id="live-date" class="live-date">${formatLiveDate()}</div>
        <div style="font-size:11px;color:var(--text-muted);opacity:0.6;text-align:right">${getTimezone()}</div>
      </div>
    </div>
    <div class="schedule-tabs">
      <div class="schedule-tab ${scheduleView === 'week' ? 'active' : ''}" onclick="scheduleView='week';loadPage('schedule')">📅 Week Overview</div>
      <div class="schedule-tab ${scheduleView === 'by-routine' ? 'active' : ''}" onclick="scheduleView='by-routine';loadPage('schedule')">📋 By Routine</div>
      <div class="schedule-tab ${scheduleView === 'timeline' ? 'active' : ''}" onclick="scheduleView='timeline';loadPage('schedule')">⏱ Timeline</div>
      <div class="schedule-tab ${scheduleView === 'all' ? 'active' : ''}" onclick="scheduleView='all';loadPage('schedule')">📊 By Frequency</div>
      ${intervals.filter(i => byInterval[i.key].length > 0).map(i =>
        `<div class="schedule-tab ${scheduleView === i.key ? 'active' : ''}" onclick="scheduleView='${i.key}';loadPage('schedule')">${i.icon} ${i.label} (${byInterval[i.key].length})</div>`
      ).join('')}
    </div>
    ${tasks.length === 0 ? `<div class="card"><div class="empty-state">No tasks found. Mark sections as schedules (📅 toggle in sidebar) and add items as tasks.</div></div>` : ''}
    ${scheduleView === 'week' ? renderWeekOverview() : scheduleView === 'by-routine' ? renderByRoutine() : scheduleView === 'timeline' ? renderTimeline() : renderByInterval()}`;
  startClock();
  if (scheduleView === 'timeline') setTimeout(htlAutoScroll, 50);
}

// ── Init ──
async function init() {
  await refreshCoreData();
  loadPage('dashboard');
}

init();
</script>
</body>
</html>
