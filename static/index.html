async function renderSchedule(c) {
  const tasks = await getList('schedule', 'Failed to load schedule');
  const scheduleSections = sidebarSections.filter(s => s.is_schedule);

  const intervals = [
    { key: 'daily', label: 'Daily', icon: '☀️' },
    { key: 'every other day', label: 'Every Other Day', icon: '🔄' },
    { key: 'weekly', label: 'Weekly', icon: '📆' },
    { key: 'biweekly', label: 'Biweekly', icon: '📅' },
    { key: 'monthly', label: 'Monthly', icon: '🗓' },
    { key: 'yearly', label: 'Yearly', icon: '📋' },
    { key: 'as needed', label: 'As Needed', icon: '⚡' },
    { key: 'none', label: 'Unscheduled', icon: '📌' },
  ];

  // Group by interval
  const byInterval = {};
  intervals.forEach(i => byInterval[i.key] = []);
  tasks.forEach(t => {
    const key = (t.task_interval || 'none').toLowerCase();
    if (byInterval[key]) byInterval[key].push(t);
    else byInterval['none'].push(t);
  });

  // Group by section (routine), sorted by task time
  const bySection = {};
  scheduleSections.forEach(s => bySection[s.page_key] = { label: s.label, tasks: [] });
  tasks.forEach(t => {
    if (bySection[t.section_key]) bySection[t.section_key].tasks.push(t);
  });
  // Sort each section's tasks by sort_order then task_time
  Object.values(bySection).forEach(s => {
    s.tasks.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  });

  function groupBySubgroup(taskList) {
    const groups = [];
    const seen = {};
    taskList.forEach(t => {
      const key = t.subgroup || '__none__';
      if (!seen[key]) { seen[key] = { label: t.subgroup, tasks: [] }; groups.push(seen[key]); }
      seen[key].tasks.push(t);
    });
    return groups;
  }

  function renderTask(t, showSection) {
    const isQO = t.is_quick_objective;
    return `<div class="schedule-task ${isQO ? 'schedule-task-qo' : ''}">
      ${statusDot(t.status_color)}
      <div class="schedule-task-info">
        <div class="schedule-task-name">${esc(t.name)}${isQO ? ' <span class="qo-badge-sm">QO</span>' : ''}</div>
        ${t.notes ? `<div class="schedule-task-meta">${esc(t.notes).substring(0, 80)}${t.notes.length > 80 ? '…' : ''}</div>` : ''}
      </div>
      ${isQO ? '<span class="schedule-task-time" style="font-style:italic;opacity:0.6">anytime</span>' : (t.task_time ? `<span class="schedule-task-time">${esc(t.task_time)}</span>` : '')}
      ${t.task_count ? `<span class="schedule-task-time">${t.task_count}×</span>` : ''}
      ${showSection ? `<span class="schedule-task-section">${esc(t.section_label)}</span>` : ''}
      <div class="schedule-task-actions">
        <button class="btn-icon" onclick="openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})" title="Edit task">✎</button>
        <button class="btn-icon" onclick="navigateTo('${esc(t.section_key)}')" title="Open section">↗</button>
      </div>
    </div>`;
  }

  function renderSubgroupedTasks(taskList, showSection) {
    const sg = groupBySubgroup(taskList);
    const hasAnySubgroup = sg.some(g => g.label);
    if (!hasAnySubgroup) return taskList.map(t => renderTask(t, showSection)).join('');
    return sg.map(g => `
      ${subgroupHeader(g.label)}
      ${g.tasks.map(t => renderTask(t, showSection)).join('')}
    `).join('');
  }

  function renderByRoutine() {
    const entries = Object.entries(bySection).filter(([_, s]) => s.tasks.length > 0);
    if (entries.length === 0) return '<div class="card"><div class="empty-state">No tasks found.</div></div>';
    return `<div class="schedule-grid">${entries.map(([key, s]) => `
      <div class="schedule-column">
        <div class="schedule-column-header">
          <span>📋</span> ${esc(s.label)}
          <span class="col-count">${s.tasks.length}</span>
        </div>
        ${renderSubgroupedTasks(s.tasks, false)}
      </div>
    `).join('')}</div>`;
  }

  function renderByInterval() {
    const visible = scheduleView === 'all'
      ? intervals
      : intervals.filter(i => i.key === scheduleView);
    return `<div class="schedule-grid">${visible.filter(i => byInterval[i.key].length > 0).map(i => `
      <div class="schedule-column">
        <div class="schedule-column-header">
          <span>${i.icon}</span> ${i.label}
          <span class="col-count">${byInterval[i.key].length}</span>
        </div>
        ${renderSubgroupedTasks(byInterval[i.key], true)}
      </div>
    `).join('')}</div>`;
  }

  function renderTimeline() {
    const entries = Object.entries(bySection).filter(([_, s]) => s.tasks.length > 0);
    if (entries.length === 0) return '<div class="card"><div class="empty-state">No tasks found.</div></div>';
    const todayDayMap = {
      0: 'custom_weekend_routine', 1: 'custom_mwf_routine', 2: 'custom_tuth_routine',
      3: 'custom_wed_routine', 4: 'custom_thu_routine', 5: 'custom_mwf_routine', 6: 'custom_weekend_routine'
    };
    const now = nowInTZ();
    const todayKey = todayDayMap[now.getDay()];

    // Default to today's routine
    const todayEntryIdx = entries.findIndex(([key]) => key === todayKey);
    if (tlCarouselStart === 0 && todayEntryIdx >= 0) tlCarouselStart = todayEntryIdx;
    const maxIdx = entries.length - 1;
    const idx = Math.min(tlCarouselStart, maxIdx);
    const [key, s] = entries[idx];
    const isToday = key === todayKey;
    const allTasks = s.tasks;
    const currentIdx = isToday ? getCurrentTaskIdx(allTasks) : -1;

    const sgColor = (t) => t.subgroup ? subgroupColor(t.subgroup) : 'var(--border)';
    const earlyCompletes = isToday ? getEarlyCompletes() : {};
    const skips = isToday ? getSkips() : {};
    const nowMin = (() => { const n = nowInTZ(); return n.getHours() * 60 + n.getMinutes(); })();

    const taskCards = allTasks.map((t, ti) => {
      const isPast = isToday && ti < currentIdx;
      const isCurrent = isToday && ti === currentIdx;
      const isNext = isToday && ti === currentIdx + 1;
      const isFuture = isToday && currentIdx >= 0 && ti > currentIdx + 1;
      const tid = String(t.id);
      const earlyDone = !!earlyCompletes[tid];
      const skipped = !!skips[tid];

      // Determine if this task has downtime (completed early, next task hasn't started yet)
      let hasDowntime = false;
      let downtimeMin = 0;
      if (earlyDone && !skipped && ti < allTasks.length - 1) {
        const nextTime = parseTimeToMin(allTasks[ti + 1].task_time);
        if (nextTime !== null && nextTime > nowMin) {
          hasDowntime = true;
          downtimeMin = nextTime - nowMin;
        }
      }

      const stateClass = earlyDone ? 'htl-done' : (isPast ? 'htl-past' : isCurrent ? 'htl-active' : isNext ? 'htl-upcoming' : (isFuture ? 'htl-future' : ''));
      const isEffectivelyCurrent = isCurrent && !earlyDone;
      const railGlow = isEffectivelyCurrent ? 'htl-rail-glow' : '';

      // Build rail: downtime rail or normal rail
      let rail = '';
      if (ti < allTasks.length - 1) {
        if (hasDowntime) {
          const dm = Math.floor(downtimeMin);
          const ds = Math.floor((downtimeMin - dm) * 60);
          rail = `<div class="htl-rail-downtime">
            <div class="htl-rail-line-red"></div>
            <div class="htl-downtime-info">
              <div class="htl-downtime-label">down time</div>
              <div class="htl-downtime-timer" data-htl-countdown="${parseTimeToMin(allTasks[ti+1].task_time)}">${dm}m</div>
              <button class="htl-skip-btn" onclick="htlSkipDowntime('${tid}')">Skip ›</button>
            </div>
          </div>`;
        } else {
          rail = `<div class="htl-rail ${railGlow}"><div class="htl-rail-line"></div></div>`;
        }
      }

      // Show complete button on current task (not already done)
      const showComplete = isEffectivelyCurrent;

      return `<div class="htl-node ${stateClass}" ${isEffectivelyCurrent ? 'data-htl-current' : ''}>
        <div class="htl-card" style="--sg-color:${sgColor(t)}">
          <div class="htl-dot-wrap">
            <div class="timeline-dot ${isEffectivelyCurrent ? 'tl-dot-glow' : ''}" style="background:${isEffectivelyCurrent ? 'var(--accent)' : earlyDone ? 'var(--green)' : sgColor(t)}"></div>
          </div>
          <div class="htl-time">${esc(t.task_time || '')}</div>
          <div class="htl-name">${esc(t.name)}</div>
          ${isEffectivelyCurrent ? '<div class="htl-badge"><span class="week-now-indicator">NOW</span></div>' : ''}
          ${isNext && !earlyDone ? '<div class="htl-badge"><span class="week-next-indicator">NEXT</span></div>' : ''}
          ${earlyDone ? '<div class="htl-badge" style="color:var(--green);font-size:10px;font-weight:600">✓ Done</div>' : ''}
          ${t.subgroup ? `<div class="htl-sg" style="color:${sgColor(t)}">${esc(t.subgroup)}</div>` : ''}
          ${showComplete ? `<button class="htl-complete-btn" onclick="htlCompleteEarly('${tid}')">Complete ✓</button>` : ''}
          <button class="htl-edit-btn" onclick="openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})">Edit</button>
        </div>
      </div>${rail}`;
    }).join('');

    const dots = entries.map((_, p) =>
      `<div class="week-nav-dot ${p === idx ? 'active' : ''}" onclick="jumpTlCarousel(${p})"></div>`
    ).join('');

    return `
      <div class="week-carousel" style="align-items:center">
        <button class="week-arrow" onclick="shiftTlCarousel(-1,${maxIdx})" ${idx <= 0 ? 'disabled' : ''}>‹</button>
        <div style="flex:1;min-width:0;text-align:center">
          <h3 style="margin-bottom:4px">📋 ${esc(s.label)}${isToday ? ' <span class="week-today-badge">Today</span>' : ''}</h3>
        </div>
        <button class="week-arrow" onclick="shiftTlCarousel(1,${maxIdx})" ${idx >= maxIdx ? 'disabled' : ''}>›</button>
      </div>
      <div class="week-nav-dots" style="margin-bottom:16px">${dots}</div>
      <div class="htl-scroll" id="htl-scroll-container">
        <div class="htl-track">${taskCards}</div>
      </div>`;
  }

  // Auto-scroll timeline to current task after render
  function htlAutoScroll() {
    const container = document.getElementById('htl-scroll-container');
    const cur = container && container.querySelector('[data-htl-current]');
    if (container && cur) {
      const offset = cur.offsetLeft - container.offsetWidth / 2 + cur.offsetWidth / 2;
      container.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
    }
  }

  // ── Week Overview helpers ──
  const dayRoutineMap = {
    0: 'custom_weekend_routine',  // Sunday
    1: 'custom_mwf_routine',     // Monday
    2: 'custom_tuth_routine',    // Tuesday
    3: 'custom_wed_routine',     // Wednesday
    4: 'custom_thu_routine',     // Thursday
    5: 'custom_mwf_routine',     // Friday
    6: 'custom_weekend_routine', // Saturday
  };
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function getWeekKey() {
    const now = new Date();
    const start = new Date(now);
    start.setDate(now.getDate() - now.getDay());
    return `week-${start.getFullYear()}-${start.getMonth()}-${start.getDate()}`;
  }

  function isTaskChecked(dayIdx, taskId) {
    const store = JSON.parse(localStorage.getItem('weekChecks') || '{}');
    return !!(store[getWeekKey()] && store[getWeekKey()][`${dayIdx}-${taskId}`]);
  }

  function renderWeekOverview() {
    const today = nowInTZ();
    const todayIdx = today.getDay();
    const nowMin = today.getHours() * 60 + today.getMinutes();
    const weekKey = getWeekKey();
    const store = JSON.parse(localStorage.getItem('weekChecks') || '{}');
    const weekData = store[weekKey] || {};

    const visibleDays = dayNames.slice(weekCarouselStart, weekCarouselStart + 3);
    const visibleIndices = [weekCarouselStart, weekCarouselStart + 1, weekCarouselStart + 2].filter(i => i < 7);

    const cards = visibleIndices.map(idx => {
      const day = dayNames[idx];
      const routineKey = dayRoutineMap[idx];
      const section = bySection[routineKey];
      const dayTasks = section ? section.tasks : [];
      const isToday = idx === todayIdx;
      const checkedCount = dayTasks.filter(t => weekData[`${idx}-${t.id}`]).length;
      const pct = dayTasks.length ? Math.round(checkedCount / dayTasks.length * 100) : 0;
      const sg = groupBySubgroup(dayTasks);
      const currentIdx = isToday ? getCurrentTaskIdx(dayTasks) : -1;
      const nextIdx = currentIdx + 1 < dayTasks.length ? currentIdx + 1 : -1;

      return `
      <div class="week-day-card ${isToday ? 'week-day-today' : ''}">
        <div class="week-day-header">
          <span class="week-day-name">${day}${isToday ? ' <span class="week-today-badge">Today</span>' : ''}</span>
          <span class="week-day-progress">${checkedCount}/${dayTasks.length} <span class="week-pct">${pct}%</span></span>
        </div>
        <div class="week-day-bar"><div class="week-day-bar-fill" style="width:${pct}%"></div></div>
        <div class="week-day-tasks">
          ${sg.map(g => {
            return `
            ${g.label ? `<div class="week-subgroup-header" style="color:${subgroupColor(g.label)}"><span class="subgroup-dot" style="background:${subgroupColor(g.label)}"></span>${esc(g.label)}</div>` : ''}
            ${g.tasks.map(t => {
              const checked = weekData[`${idx}-${t.id}`];
              const globalIdx = dayTasks.indexOf(t);
              const isCurrent = isToday && globalIdx === currentIdx;
              const isNext = isToday && globalIdx === nextIdx;
              const tMin = parseTimeToMin(t.task_time);
              const isPast = isToday && tMin !== null && tMin < nowMin && !isCurrent;
              return `<label class="week-task-row ${checked ? 'week-task-done' : ''} ${isCurrent ? 'week-task-current' : ''} ${isNext ? 'week-task-next' : ''} ${isPast && !checked ? 'week-task-past' : ''}">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleWeekTask(${idx},${t.id},this.checked)">
                <span class="week-task-time">${esc(t.task_time || '')}</span>
                <span class="week-task-name">${esc(t.name)}</span>
                ${isCurrent ? '<span class="week-now-indicator">NOW</span>' : ''}
                ${isNext ? '<span class="week-next-indicator">NEXT</span>' : ''}
                <button type="button" class="btn-icon week-edit-btn" onclick="event.preventDefault();event.stopPropagation();openScheduleTaskEditModal('${esc(t.section_key)}', ${t.id})" title="Edit task">✎</button>
              </label>`;
            }).join('')}`;
          }).join('')}
          ${dayTasks.length === 0 ? '<div style="color:var(--text-muted);padding:8px;font-size:12px">No tasks</div>' : ''}
        </div>
      </div>`;
    }).join('');

    const dots = [0,1,2,3,4].map(p =>
      `<div class="week-nav-dot ${p === weekCarouselStart ? 'active' : ''}" onclick="jumpWeekCarousel(${p})"></div>`
    ).join('');

    return `
      <div class="week-carousel">
        <button class="week-arrow" onclick="shiftWeekCarousel(-1)" ${weekCarouselStart <= 0 ? 'disabled' : ''}>‹</button>
        <div class="week-overview">${cards}</div>
        <button class="week-arrow" onclick="shiftWeekCarousel(1)" ${weekCarouselStart >= 4 ? 'disabled' : ''}>›</button>
      </div>
      <div class="week-nav-dots">${dots}</div>`;
  }

  const isIntervalTab = scheduleView !== 'by-routine' && scheduleView !== 'timeline' && scheduleView !== 'week';

  c.innerHTML = `
    <div class="page-header">
      <div>
        <h2>📅 Master Schedule</h2>
        <span style="color:var(--text-muted);font-size:13px">${tasks.length} task${tasks.length !== 1 ? 's' : ''} across ${scheduleSections.length} schedule${scheduleSections.length !== 1 ? 's' : ''}</span>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="openAiOptimizeModal()">AI Optimize Tasks</button>
          <button class="btn" onclick="openAiRoutineModal()">AI Build Routine</button>
        </div>
      </div>
      <div class="live-clock-box">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <div id="live-clock" class="live-clock">${formatLiveClock()}</div>
          <button class="btn-icon tz-btn" onclick="openTimezoneModal()" title="Timezone settings">⚙️</button>
        </div>
        <div id="live-date" class="live-date">${formatLiveDate()}</div>
        <div style="font-size:11px;color:var(--text-muted);opacity:0.6;text-align:right">${getTimezone()}</div>
      </div>
    </div>
    <div class="schedule-tabs">
      <div class="schedule-tab ${scheduleView === 'week' ? 'active' : ''}" onclick="scheduleView='week';loadPage('schedule')">📅 Week Overview</div>
      <div class="schedule-tab ${scheduleView === 'by-routine' ? 'active' : ''}" onclick="scheduleView='by-routine';loadPage('schedule')">📋 By Routine</div>
      <div class="schedule-tab ${scheduleView === 'timeline' ? 'active' : ''}" onclick="scheduleView='timeline';loadPage('schedule')">⏱ Timeline</div>
      <div class="schedule-tab ${scheduleView === 'all' ? 'active' : ''}" onclick="scheduleView='all';loadPage('schedule')">📊 By Frequency</div>
      ${intervals.filter(i => byInterval[i.key].length > 0).map(i =>
        `<div class="schedule-tab ${scheduleView === i.key ? 'active' : ''}" onclick="scheduleView='${i.key}';loadPage('schedule')">${i.icon} ${i.label} (${byInterval[i.key].length})</div>`
      ).join('')}
    </div>
    ${tasks.length === 0 ? `<div class="card"><div class="empty-state">No tasks found. Mark sections as schedules (📅 toggle in sidebar) and add items as tasks.</div></div>` : ''}
    ${scheduleView === 'week' ? renderWeekOverview() : scheduleView === 'by-routine' ? renderByRoutine() : scheduleView === 'timeline' ? renderTimeline() : renderByInterval()}`;
  startClock();
  if (scheduleView === 'timeline') setTimeout(htlAutoScroll, 50);
}

// ── Init ──
async function init() {
  await refreshCoreData();
  loadPage('dashboard');
}

init();
</script>
</body>
</html>
