<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Optimization</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --green: #3fb950;
  --blue: #58a6ff;
  --orange: #d29922;
  --red: #f85149;
  --accent: #58a6ff;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; position: fixed; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.main { margin-left: 220px; flex: 1; padding: 32px 40px; max-width: 1100px; }

/* Sidebar */
.sidebar h1 { font-size: 15px; padding: 0 20px 20px; color: var(--text); font-weight: 600; letter-spacing: -0.3px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidebar h1 span { display: block; font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
.nav-item { display: flex; align-items: center; padding: 8px 20px; font-size: 14px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
.nav-item:hover { color: var(--text); background: var(--surface2); }
.nav-item.active { color: var(--text); background: var(--surface2); border-left-color: var(--accent); }
.nav-item .nav-label { flex: 1; }
.nav-item .nav-remove { display: none; font-size: 14px; color: var(--text-muted); padding: 0 2px; line-height: 1; cursor: pointer; border-radius: 3px; }
.nav-item .nav-remove:hover { color: var(--red); background: rgba(248,81,73,0.15); }
.nav-item:hover .nav-remove { display: block; }
.nav-item .nav-drag { display: none; font-size: 12px; color: var(--text-muted); cursor: grab; padding: 0 2px; line-height: 1; user-select: none; }
.nav-item:hover .nav-drag { display: block; }
.nav-item.dragging { opacity: 0.4; }
.nav-item.drag-over { border-top: 2px solid var(--accent); margin-top: -2px; }
.nav-section.drag-over-group { border-bottom: 2px solid var(--accent); }
.nav-schedule-icon { font-size: 13px; margin-right: 4px; flex-shrink: 0; opacity: 0.7; }
.nav-item .nav-schedule-toggle { display: none; font-size: 11px; color: var(--text-muted); cursor: pointer; padding: 0 3px; line-height: 1; border-radius: 3px; margin-right: 2px; }
.nav-item .nav-schedule-toggle:hover { color: var(--accent); background: rgba(88,166,255,0.15); }
.nav-item:hover .nav-schedule-toggle { display: block; }
.nav-item .nav-lto-icon { font-size: 12px; margin-right: 6px; flex-shrink: 0; opacity: 0.85; }
.nav-section { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 16px 20px 6px; letter-spacing: 0.5px; font-weight: 600; display: flex; align-items: center; }
.nav-section .nav-label { flex: 1; }
.nav-section .nav-add { display: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 0 2px; line-height: 1; border-radius: 3px; }
.nav-section .nav-add:hover { color: var(--green); }
.nav-section:hover .nav-add { display: block; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--border); margin-top: auto; }
.sidebar-add-section { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; padding: 6px 0; transition: color 0.15s; }
.sidebar-add-section:hover { color: var(--accent); }
#sidebar-nav { flex: 1; }

/* Header */
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-header h2 { font-size: 24px; font-weight: 600; }

/* Status dots */
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
.status-dot.green { background: var(--green); }
.status-dot.blue { background: var(--blue); }
.status-dot.orange { background: var(--orange); }
.status-dot.red { background: var(--red); }

/* Legend */
.legend { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; font-size: 12px; color: var(--text-muted); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 16px; margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

/* Tables */
.item-list { list-style: none; }
.item-row { display: flex; align-items: center; padding: 10px 12px; border-radius: 6px; margin-bottom: 2px; transition: background 0.15s; gap: 12px; }
.item-row:hover { background: var(--surface2); }
.item-name { flex: 1; font-size: 14px; }
.item-category { font-size: 12px; color: var(--text-muted); min-width: 100px; }
.item-link { font-size: 12px; }
.item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.item-row:hover .item-actions { opacity: 1; }

/* Buttons */
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--border); }
.btn-primary { background: #238636; border-color: #2ea043; }
.btn-primary:hover { background: #2ea043; }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: rgba(248,81,73,0.15); }
.btn-sm { padding: 4px 8px; font-size: 12px; }
.btn-icon { padding: 4px 6px; background: transparent; border: none; color: var(--text-muted); font-size: 16px; }
.btn-icon:hover { color: var(--text); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 480px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 18px; margin-bottom: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
}
.form-group textarea { min-height: 80px; resize: vertical; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* Routine sections */
.routine-section { margin-bottom: 24px; }
.routine-title { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.step-number { font-size: 12px; color: var(--text-muted); min-width: 24px; text-align: center; }

/* Goals */
.goal-row { display: flex; align-items: flex-start; padding: 12px; border-radius: 6px; margin-bottom: 4px; gap: 12px; }
.goal-row:hover { background: var(--surface2); }
.goal-checkbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.goal-checkbox.checked { background: var(--green); border-color: var(--green); }
.goal-checkbox.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
.goal-title { font-size: 14px; flex: 1; }
.goal-title.completed { text-decoration: line-through; color: var(--text-muted); }
.goal-meta { font-size: 12px; color: var(--text-muted); }
.priority-high { color: var(--red); }
.priority-med { color: var(--orange); }
.priority-low { color: var(--text-muted); }

/* Goal AI Analysis */
.goal-analysis-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.goal-analysis-panel .analysis-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.goal-analysis-panel .analysis-title { font-size: 15px; font-weight: 600; color: var(--accent); }
.goal-analysis-panel .analysis-meta { font-size: 11px; color: var(--text-muted); }
.goal-analysis-panel .analysis-summary { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
.goal-priority-list { display: flex; flex-direction: column; gap: 10px; }
.goal-priority-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px; display: flex; gap: 14px; align-items: flex-start; }
.goal-rank { font-size: 18px; font-weight: 700; color: var(--accent); min-width: 28px; flex-shrink: 0; line-height: 1.1; }
.goal-rank.rank-1 { color: #ffd700; }
.goal-rank.rank-2 { color: #c0c0c0; }
.goal-rank.rank-3 { color: #cd7f32; }
.goal-priority-info { flex: 1; min-width: 0; }
.goal-priority-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.goal-priority-area { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.goal-priority-reasoning { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 8px; }
.goal-metrics { display: flex; gap: 10px; flex-wrap: wrap; }
.goal-metric { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); }
.goal-metric .metric-icon { font-size: 13px; }
.goal-metric .metric-val { font-weight: 600; }
.diff-easy { border-color: var(--green) !important; }
.diff-med { border-color: var(--orange) !important; }
.diff-hard { border-color: var(--red) !important; }
.analysis-loading { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 10px 0; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Goal Archive */
.term-section { margin-bottom: 24px; }
.term-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.term-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; padding: 3px 8px; border-radius: 20px; }
.term-badge.overdue { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid var(--red); }
.term-badge.short { background: rgba(248,81,73,0.1); color: var(--orange); border: 1px solid var(--orange); }
.term-badge.medium { background: rgba(88,166,255,0.1); color: var(--blue); border: 1px solid var(--blue); }
.term-badge.long { background: rgba(63,185,80,0.1); color: var(--green); border: 1px solid var(--green); }
.term-subtitle { font-size: 12px; color: var(--text-muted); }
.term-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.archive-goal-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; }
.archive-goal-card.completed-card { opacity: 0.55; }
.archive-goal-card .agc-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.archive-goal-card .agc-body { flex: 1; min-width: 0; }
.archive-goal-card .agc-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.archive-goal-card .agc-title.done { text-decoration: line-through; color: var(--text-muted); }
.archive-goal-card .agc-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.archive-goal-card .agc-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.agc-tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
.agc-tag.area { color: var(--accent); border-color: rgba(88,166,255,0.3); }
.agc-tag.date { color: var(--text-muted); }
.agc-tag.date.overdue { color: var(--red); }
.archive-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filter-chip { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; color: var(--text-muted); background: var(--surface); transition: all 0.15s; user-select: none; }
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
.archive-empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
.today-combo { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
.today-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.today-col h4 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.today-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
.today-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.today-stat { font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; color: var(--text-muted); background: var(--surface2); }
.today-goal-score { font-size: 11px; color: var(--accent); font-weight: 600; }
.goal-select-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; background: var(--surface); }
.goal-select-inline.selected { color: var(--accent); border-color: rgba(88,166,255,0.45); }
.goal-select-inline input { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
.goal-picker-check { width: 16px; height: 16px; accent-color: var(--accent); margin-right: 8px; }
@media (max-width: 960px) {
  .today-combo { grid-template-columns: 1fr; }
}

/* Custom items with notes */
.custom-item { margin-bottom: 4px; cursor: grab; }
.custom-item[draggable] { transition: opacity 0.15s, border-color 0.15s; }
.custom-item.dragging-item { opacity: 0.4; }
.custom-item.drag-over-item { border-top: 2px solid var(--accent); }
.drag-handle-item { cursor: grab; color: var(--text-muted); font-size: 14px; opacity: 0.3; margin-right: 2px; }
.drag-handle-item:hover { opacity: 0.8; }
.item-notes { font-size: 13px; color: var(--text-muted); padding: 4px 12px 10px 28px; line-height: 1.6; }
.task-badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(88,166,255,0.15); color: var(--blue); padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
.qo-badge { background: rgba(163,113,247,0.15); color: var(--purple, #a371f7); }
.lto-badge { background: rgba(246,190,46,0.2); color: #ffd86b; }
.sessions-badge { background: rgba(56,173,169,0.18); color: #38ada9; }
.lto-sessions-info { font-size: 12px; color: #38ada9; padding: 2px 0 4px 0; font-weight: 500; }
.schedule-session-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.session-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.session-bar-fill { height: 100%; background: #38ada9; border-radius: 3px; transition: width 0.3s; }
.session-text { font-size: 11px; color: #38ada9; white-space: nowrap; font-weight: 600; }
.session-done-btn { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid #38ada9; color: #38ada9; background: transparent; cursor: pointer; white-space: nowrap; }
.session-done-btn:hover { background: rgba(56,173,169,0.15); }
.qo-badge-sm { display: inline-block; font-size: 9px; font-weight: 600; background: rgba(163,113,247,0.15); color: var(--purple, #a371f7); padding: 0 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.schedule-task-qo { border-left: 2px solid var(--purple, #a371f7); }
.task-schedule { font-size: 12px; color: var(--accent); padding: 2px 12px 4px 28px; }

/* Long-term objective timeline */
.lto-timeline { margin-top: 6px; }
.lto-item { display: flex; gap: 10px; }
.lto-marker { width: 18px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.lto-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 9px; background: var(--orange); box-shadow: 0 0 0 2px rgba(210,153,34,0.25); }
.lto-line { width: 2px; flex: 1; background: var(--border); margin-top: 5px; }
.lto-item:last-child .lto-line { display: none; }
.lto-card { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: rgba(22,27,34,0.55); }
.lto-head { display: flex; align-items: center; gap: 10px; }
.lto-name { font-size: 15px; flex: 1; }
.lto-done .lto-name { text-decoration: line-through; color: var(--text-muted); }
.lto-done .lto-dot { background: var(--green); box-shadow: 0 0 0 2px rgba(63,185,80,0.25); }
.lto-notes { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.55; }

/* Schedule view */
.schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.schedule-column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.schedule-column-header { padding: 14px 16px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.schedule-column-header .col-count { font-size: 11px; font-weight: 400; color: var(--text-muted); background: var(--surface2); padding: 1px 7px; border-radius: 10px; }
.schedule-task { display: flex; align-items: center; padding: 10px 16px; gap: 10px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.schedule-task:last-child { border-bottom: none; }
.schedule-task:hover { background: var(--surface2); }
.schedule-task-info { flex: 1; min-width: 0; }
.schedule-task-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.schedule-task-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.schedule-task-time { font-size: 12px; color: var(--accent); white-space: nowrap; }
.schedule-task-section { font-size: 11px; color: var(--text-muted); background: var(--surface2); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.schedule-task-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.schedule-task:hover .schedule-task-actions { opacity: 1; }
.schedule-empty { padding: 20px 16px; color: var(--text-muted); font-size: 13px; text-align: center; }
.schedule-subgroup-header { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 16px 4px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.schedule-subgroup-header .subgroup-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.schedule-column > .schedule-subgroup-header:first-child, .schedule-column > .schedule-column-header + .schedule-subgroup-header { border-top: none; }
.schedule-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.schedule-tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); transition: all 0.15s; }
.schedule-tab:hover { color: var(--text); background: var(--surface2); }
.schedule-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Timeline view */
.timeline-list { padding: 0 4px; }

/* Week Overview */
.week-carousel { display: flex; align-items: stretch; gap: 0; }
.week-arrow { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.week-arrow:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }
.week-arrow:disabled { opacity: 0.3; cursor: default; border-color: var(--border); color: var(--text-muted); background: var(--surface); }
.week-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; min-width: 0; margin: 0 10px; }
@media (max-width: 800px) { .week-overview { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .week-overview { grid-template-columns: 1fr; } }
.week-nav-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.week-nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background 0.15s; }
.week-nav-dot.active { background: var(--accent); }
.week-nav-dot:hover { background: var(--text-muted); }
.week-day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.week-day-card.week-day-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.week-day-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; }
.week-day-name { font-weight: 600; font-size: 14px; }

.timeline-time { width: 70px; flex-shrink: 0; font-size: 12px; color: var(--accent); text-align: right; padding-top: 2px; font-weight: 500; }
.timeline-dot-col { display: flex; flex-direction: column; align-items: center; width: 16px; flex-shrink: 0; }

/* Timeline current-time indicators */

.tl-past .timeline-time { color: var(--text-muted); }

.tl-current .timeline-time { color: var(--accent); font-weight: 700; font-size: 13px; }

.tl-dot-glow { width: 14px; height: 14px; margin-top: 2px; box-shadow: 0 0 8px 3px rgba(88,166,255,0.6), 0 0 20px 6px rgba(88,166,255,0.25); animation: dotPulse 2s ease-in-out infinite; }
.tl-line-glow { background: var(--accent); box-shadow: 0 0 6px 1px rgba(88,166,255,0.4); }
.tl-next .schedule-task-name { color: var(--purple, #a371f7); }
@keyframes dotPulse { 0%, 100% { box-shadow: 0 0 8px 3px rgba(88,166,255,0.6), 0 0 20px 6px rgba(88,166,255,0.25); } 50% { box-shadow: 0 0 12px 5px rgba(88,166,255,0.8), 0 0 28px 10px rgba(88,166,255,0.35); } }

/* Timeline carousel */
.tl-carousel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; min-width: 0; margin: 0 10px; }
@media (max-width: 900px) { .tl-carousel-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 550px) { .tl-carousel-grid { grid-template-columns: 1fr; } }
.tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; overflow-y: auto; max-height: 600px; }

/* Horizontal timeline */
.htl-scroll { overflow-x: auto; padding: 4px 0 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.htl-scroll::-webkit-scrollbar { height: 6px; }
.htl-scroll::-webkit-scrollbar-track { background: transparent; }

.htl-card { width: 130px; padding: 14px 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); text-align: center; transition: all 0.2s ease; position: relative; overflow: hidden; }
.htl-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 12px 12px 0 0; background: var(--sg-color, var(--border)); transition: background 0.2s; }

.htl-rail { display: flex; align-items: center; width: 36px; flex-shrink: 0; position: relative; }
.htl-rail-line { width: 100%; height: 2px; background: var(--border); }
.htl-rail-glow .htl-rail-line { background: linear-gradient(90deg, var(--accent), var(--border)); height: 2px; box-shadow: 0 0 6px rgba(88,166,255,0.3); }
.htl-dot-wrap { display: flex; justify-content: center; margin: 10px 0 8px; position: relative; z-index: 1; }
.htl-time { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; letter-spacing: 0.3px; }
.htl-name { font-size: 12.5px; font-weight: 500; line-height: 1.35; word-break: break-word; color: var(--text); }
.htl-badge { margin-top: 6px; }
.htl-notes { font-size: 10px; color: var(--text-muted); margin-top: 6px; line-height: 1.3; opacity: 0.8; }
/* States */
.htl-past .htl-card { opacity: 0.4; border-color: var(--border); }
.htl-past .htl-rail-line { background: var(--text-muted); opacity: 0.3; }
.htl-active .htl-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(88,166,255,0.15), 0 4px 16px rgba(0,0,0,0.3); transform: translateY(-3px); }

/* Early complete */
.htl-complete-btn { margin-top: 8px; font-size: 10px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--green); color: var(--green); background: transparent; cursor: pointer; transition: all 0.15s; font-weight: 600; letter-spacing: 0.3px; }

/* Downtime rail */

@keyframes downtimePulse { 0%,100% { box-shadow: 0 0 8px rgba(248,81,73,0.4); } 50% { box-shadow: 0 0 14px rgba(248,81,73,0.7); } }
.htl-downtime-info { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.htl-downtime-label { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--red); }

.htl-skip-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }

/* Dashboard */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.stat-value { font-size: 32px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.dashboard-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-bottom: 20px; }
.dashboard-focus-item { border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); padding: 10px 12px; margin-bottom: 8px; }
.dashboard-focus-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.dashboard-focus-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.focus-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.focus-tag.overdue { color: var(--red); border-color: var(--red); }
.focus-tag.upcoming { color: var(--orange); border-color: var(--orange); }
.focus-tag.long_term { color: var(--blue); border-color: var(--blue); }
.dashboard-search-wrap { margin-bottom: 14px; }
.dashboard-search-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
.dashboard-search-results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.dashboard-search-item { border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); padding: 9px 11px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.dashboard-search-item:hover { border-color: var(--accent); background: rgba(88,166,255,0.08); }

.dashboard-search-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
@media (max-width: 980px) {
  .dashboard-grid { grid-template-columns: 1fr; }
}

/* Empty state */

.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; font-size: 14px; z-index: 200; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }

/* Global load banner */
.load-banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); width: min(980px, calc(100vw - 28px)); background: rgba(248,81,73,0.14); border: 1px solid rgba(248,81,73,0.55); border-radius: 10px; padding: 12px 14px; z-index: 260; display: none; backdrop-filter: blur(2px); }
.load-banner.show { display: block; }
.load-banner-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.load-banner-title { font-size: 13px; font-weight: 600; color: #ffd4d1; }
.load-banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.load-banner-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
.load-banner-list.collapsed { display: none; }
.load-banner-toggle { background: transparent; border: 1px solid rgba(255,212,209,0.45); color: #ffd4d1; border-radius: 6px; font-size: 11px; padding: 4px 8px; cursor: pointer; }
.load-banner-toggle:hover { background: rgba(255,212,209,0.12); }
.load-banner-item { font-size: 12px; color: #ffd4d1; background: rgba(13,17,23,0.45); border: 1px solid rgba(248,81,73,0.35); border-radius: 999px; padding: 5px 9px; display: inline-flex; align-items: center; gap: 8px; }
.load-banner-item button { background: transparent; border: 1px solid rgba(255,212,209,0.45); color: #ffd4d1; border-radius: 999px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.load-banner-item button:hover { background: rgba(255,212,209,0.12); }

/* AI Interface */
.ai-chat-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; }
.ai-chat-feed { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-height: 360px; max-height: 62vh; overflow-y: auto; padding: 14px; }
.ai-msg { margin-bottom: 12px; }
.ai-msg-role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 4px; }
.ai-msg-bubble { border: 1px solid var(--border); background: var(--surface2); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.ai-msg-user .ai-msg-bubble { border-color: rgba(88,166,255,0.45); background: rgba(88,166,255,0.08); }
.ai-query-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Research panel */
.research-panel { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px; margin-bottom: 16px; }
.research-panel h3 { margin: 0 0 12px 0; font-size: 16px; }
.research-results { margin-top: 12px; }
.research-result-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface2); }
.research-result-card a { color: var(--accent); text-decoration: none; font-weight: 600; }
.research-result-card a:hover { text-decoration: underline; }
.research-result-card .rr-snippet { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
.research-analysis { margin-top: 14px; padding: 12px; background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.18); border-radius: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.research-goal-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; background: var(--surface2); display: flex; gap: 12px; align-items: flex-start; }
.research-goal-card .rg-body { flex: 1; }
.research-goal-card .rg-title { font-weight: 600; font-size: 14px; }
.research-goal-card .rg-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
.research-goal-card .rg-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.research-goal-card .rg-tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); background: var(--surface); }
.research-loading { text-align: center; padding: 24px; color: var(--text-muted); font-size: 14px; }

<body>
<div class="load-banner" id="load-banner">
  <div class="load-banner-header">
    <div class="load-banner-title" id="load-banner-title">Some data failed to load.</div>
    <div class="load-banner-actions">
      <button class="load-banner-toggle" id="load-banner-toggle" onclick="toggleLoadBannerDetails()">Show Details</button>
      <button class="btn btn-sm" onclick="retryAllFailedLoads()">Retry All</button>
      <button class="btn btn-sm" onclick="dismissLoadBanner()">Dismiss</button>
    </div>
  </div>
  <div class="load-banner-list collapsed" id="load-banner-list"></div>
</div>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <h1>Life Optimization <span>Dashboard</span></h1>
    <div id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <div class="sidebar-add-section" onclick="openAddSectionModal()">+ Add Section</div>
    </div>
  </nav>

  <div class="main" id="content"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──
let statuses = [];
let fashionCategories = [];
let skincareRoutines = [];
let lifeAreas = [];
let sidebarSections = [];
let currentPage = 'dashboard';
let loadFailures = {};
let aiChatHistory = [];
let aiStatusInfo = null;
let dashboardSearchTimer = null;
const loadBannerPrefKey = 'lifeopt_load_banner_expanded';
let loadBannerExpanded = localStorage.getItem(loadBannerPrefKey) === '1';

// ── API helpers ──
async function api(url, opts = {}) {
  if (opts.body && typeof opts.body === 'object') {
    opts.headers = { 'Content-Type': 'application/json', ...opts.headers };
    opts.body = JSON.stringify(opts.body);
  }
  try {
    const res = await fetch('/api/' + url, opts);
    const contentType = res.headers.get('content-type') || '';
    let data = {};
    if (contentType.includes('application/json')) {
      data = await res.json();
    }
    if (!res.ok) {
      if (!data || typeof data !== 'object') data = {};
      if (!data.error) data.error = `Request failed (${res.status})`;
      data.status = res.status;
      return data;
    }
    return data;
  } catch (err) {
    return { error: `Network error: ${err.message || 'request failed'}` };
  }
}

function apiHasError(res) {
  return !!(res && typeof res === 'object' && res.error);
}

function showApiError(res) {
  if (apiHasError(res)) {
    toast(res.error);
    return true;
  }
  return false;
}

async function getList(url, label, options = {}) {
  const { toastOnError = false } = options;
  const res = await api(url);
  if (apiHasError(res)) {
    setLoadFailure(url, label, res.error);
    if (toastOnError) toast(`${label}: ${res.error}`);
    return [];
  }
  clearLoadFailure(url);
  return Array.isArray(res) ? res : [];
}

function renderLoadBanner() {
  const banner = document.getElementById('load-banner');
  const title = document.getElementById('load-banner-title');
  const list = document.getElementById('load-banner-list');
  const toggle = document.getElementById('load-banner-toggle');
  if (!banner || !title || !list || !toggle) return;

  const entries = Object.values(loadFailures);
  if (entries.length === 0) {
    banner.classList.remove('show');
    list.innerHTML = '';
    list.classList.add('collapsed');
    toggle.textContent = 'Show Details';
    loadBannerExpanded = false;
    return;
  }

  title.textContent = entries.length === 1
    ? '1 data source failed to load.'
    : `${entries.length} data sources failed to load.`;
  list.innerHTML = entries.map(entry =>
    `<div class="load-banner-item">${esc(entry.label)}<button onclick="retryFailedLoad('${esc(entry.url)}')">Retry</button></div>`
  ).join('');
  if (loadBannerExpanded) {
    list.classList.remove('collapsed');
    toggle.textContent = 'Hide Details';
  } else {
    list.classList.add('collapsed');
    toggle.textContent = 'Show Details';
  }
  banner.classList.add('show');
}

function toggleLoadBannerDetails() {
  loadBannerExpanded = !loadBannerExpanded;
  localStorage.setItem(loadBannerPrefKey, loadBannerExpanded ? '1' : '0');
  renderLoadBanner();
}

function setLoadFailure(url, label, error) {
  loadFailures[url] = { url, label, error };
  renderLoadBanner();
}

function clearLoadFailure(url) {
  if (loadFailures[url]) {
    delete loadFailures[url];
    renderLoadBanner();
  }
}

function dismissLoadBanner() {
  loadFailures = {};
  loadBannerExpanded = false;
  renderLoadBanner();
}

async function refreshCoreData() {
  [statuses, fashionCategories, skincareRoutines, lifeAreas, sidebarSections] = await Promise.all([
    getList('statuses', 'Failed to load statuses', { toastOnError: false }),
    getList('fashion/categories', 'Failed to load fashion categories', { toastOnError: false }),
    getList('skincare/routines', 'Failed to load skincare routines', { toastOnError: false }),
    getList('life-areas', 'Failed to load life areas', { toastOnError: false }),
    getList('sidebar', 'Failed to load sidebar', { toastOnError: false })
  ]);
  if (sidebarSections.length === 0) {
    sidebarSections = [{ id: 0, group_name: 'Overview', label: 'Dashboard', page_key: 'dashboard', is_schedule: 0 }];
  }
  buildSidebar();
}

async function retryFailedLoad(url) {
  const entry = loadFailures[url];
  if (!entry) return;
  await getList(url, entry.label, { toastOnError: true });
  await refreshCoreData();
  await loadPage(currentPage);
}

async function retryAllFailedLoads() {
  const failures = Object.values(loadFailures);
  for (const entry of failures) {
    await getList(entry.url, entry.label, { toastOnError: true });
  }
  await refreshCoreData();
  await loadPage(currentPage);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getFormData(formId) {
  const form = document.getElementById(formId);
  const data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'number') data[el.name] = el.value ? Number(el.value) : null;
    else data[el.name] = el.value || null;

  return data;

// ── Navigation ──
function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const groups = {};
  sidebarSections.forEach(s => {
    if (!groups[s.group_name]) groups[s.group_name] = [];
    groups[s.group_name].push(s);
  });
  let html = '';
  Object.entries(groups).forEach(([group, items]) => {
    html += `<div class="nav-section">
      <span class="nav-label">${esc(group)}</span>
      <span class="nav-add" onclick="openAddItemToGroupModal('${esc(group)}')" title="Add page to ${esc(group)}">+</span>
    </div>`;
    items.forEach(s => {
      const isAiPage = s.page_key === 'ai_interface';
      const removeBtn = (s.page_key === 'dashboard' || isAiPage) ? '' :
        `<span class="nav-remove" onclick="event.stopPropagation(); removeSidebarSection(${s.id}, '${esc(s.label)}', '${esc(s.page_key)}')" title="Remove">✕</span>`;
      const scheduleIcon = s.is_schedule ? '<span class="nav-schedule-icon" title="Schedule">📅</span>' : '';
      const aiIcon = isAiPage ? '<span class="nav-schedule-icon" title="AI">🤖</span>' : '';
      const hasLongTerm = Number(s.is_long_term_section || 0) === 1 || Number(s.long_term_count || 0) > 0;
      const longTermIcon = hasLongTerm ? '<span class="nav-lto-icon" title="Long-term objectives">🎯</span>' : '';
      const scheduleToggle = (s.page_key === 'dashboard' || isAiPage) ? '' :
        `<span class="nav-schedule-toggle" onclick="event.stopPropagation(); toggleSchedule(${s.id})" title="${s.is_schedule ? 'Unmark as schedule' : 'Mark as schedule'}">${s.is_schedule ? '📅' : '🗓'}</span>`;
      html += `<div class="nav-item ${s.page_key === currentPage ? 'active' : ''}" data-page="${esc(s.page_key)}" data-id="${s.id}" draggable="true" onclick="navigateTo('${esc(s.page_key)}')" ondragstart="onSidebarDragStart(event)" ondragover="onSidebarDragOver(event)" ondrop="onSidebarDrop(event)" ondragend="onSidebarDragEnd(event)">
        <span class="nav-drag" title="Drag to reorder">⠿</span>
        ${aiIcon}
        ${scheduleIcon}
        ${longTermIcon}
        <span class="nav-label">${esc(s.label)}</span>
        ${scheduleToggle}
        ${removeBtn}
      </div>`;
    });
  });
  nav.innerHTML = html;
}

function navigateTo(page) {
  currentPage = page;
  buildSidebar();
  loadPage(page);
}

// ── Sidebar Drag & Drop ──
let draggedSectionId = null;

function onSidebarDragStart(e) {
  draggedSectionId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onSidebarDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (target.dataset.id !== draggedSectionId) {
    // Clear other drag-over indicators
    document.querySelectorAll('.nav-item.drag-over').forEach(el => el.classList.remove('drag-over'));
    target.classList.add('drag-over');
  }
}

function onSidebarDrop(e) {
  e.preventDefault();
  const targetId = e.currentTarget.dataset.id;
  if (!draggedSectionId || draggedSectionId === targetId) return;
  // Reorder: move dragged item before the target
  const items = document.querySelectorAll('.nav-item[data-id]');
  const order = [];
  items.forEach(el => {
    const id = el.dataset.id;
    if (id === draggedSectionId) return; // skip dragged, will insert at target
    if (id === targetId) order.push(draggedSectionId);
    order.push(id);
  });
  saveSidebarOrder(order.map(Number));
}

function onSidebarDragEnd(e) {
  draggedSectionId = null;
  document.querySelectorAll('.nav-item.dragging, .nav-item.drag-over').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
}

async function saveSidebarOrder(order) {
  const res = await api('sidebar/reorder', { method: 'PUT', body: { order } });
  if (showApiError(res)) return;
  sidebarSections = await getList('sidebar', 'Failed to refresh sidebar');
  buildSidebar();
}

async function loadPage(page) {
  const c = document.getElementById('content');
  switch (page) {
    case 'dashboard': return renderDashboard(c);
    case 'purchases': return renderPurchases(c);
    case 'fashion': return renderFashion(c);
    case 'skincare': return renderSkincare(c);
    case 'pharmacology': return renderPharmacology(c);
    case 'goals': return renderGoals(c);
    case 'tasks': return renderTasks(c);
    case 'misc': return renderMiscItems(c);
    case 'goal_archive': return renderGoalArchive(c);
    case 'schedule': return renderSchedule(c);
    case 'ai_interface': return renderAiInterface(c);
    default:
      if (page.startsWith('custom_')) return renderCustomSection(c, page);
  }
}

async function sendResearch() {
  const topicEl = document.getElementById('research-topic');
  const areaEl = document.getElementById('research-area');
  const autoCreateEl = document.getElementById('research-auto-create');
  const resultsDiv = document.getElementById('research-results');
  if (!topicEl || !resultsDiv) return;

  const topic = topicEl.value.trim();
  if (!topic) { toast('Enter a research topic'); return; }

  resultsDiv.innerHTML = '<div class="research-loading"><span class="spin">⟳</span> Researching the web and analyzing results…</div>';

  const res = await api('ai/research', {
    method: 'POST',
    body: {
      topic,
      life_area_id: areaEl && areaEl.value ? Number(areaEl.value) : null,
      create_goals: autoCreateEl && autoCreateEl.checked ? 1 : 0,
      token_limit: 2000,
    },
  });

  if (showApiError(res)) {
    resultsDiv.innerHTML = '<div class="research-loading" style="color:var(--red)">Research failed. Check API keys and try again.</div>';
    return;
  }

  const searchResults = res.search_results || [];
  const analysis = res.analysis || '';
  const suggestedGoals = res.suggested_goals || [];
  const createdGoals = res.created_goals || [];

  const toList = (value) => Array.isArray(value)
    ? value.map(v => String(v || '').trim()).filter(Boolean)
    : [];

  const renderDetailList = (label, items) => {
    const vals = toList(items);
    if (!vals.length) return '';
    return `<div class="rg-desc" style="margin-top:8px"><strong>${esc(label)}:</strong><ul style="margin:6px 0 0 18px">${vals.map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>`;
  };

  const renderSubgoals = (goal) => {
    const subgoals = Array.isArray(goal?.subgoals) ? goal.subgoals : [];
    if (!subgoals.length) return '';
    return `<div class="rg-desc" style="margin-top:10px"><strong>Subgoals:</strong>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
        ${subgoals.map((sg, idx) => `
          <div style="border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface);">
            <div style="font-size:13px;font-weight:600;">${idx + 1}. ${esc(String(sg?.title || 'Subgoal'))}</div>
            ${sg?.description ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${esc(String(sg.description))}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
  };

  let html = '';

  // Search results
  if (searchResults.length) {
    html += `<div class="research-results">
      <h4 style="margin:0 0 8px 0;font-size:14px;color:var(--text-muted)">🌐 Web Results (${searchResults.length})</h4>
      ${searchResults.map(r => `
        <div class="research-result-card">
          <a href="${esc(r.link)}" target="_blank">${esc(r.title)}</a>
          <div class="rr-snippet">${esc(r.snippet)}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // AI Analysis
  if (analysis) {
    html += `<div class="research-analysis"><strong>AI Analysis (${esc(res.mode)}):</strong>\n\n${esc(analysis)}</div>`;
  }

  // Suggested/created goals
  if (suggestedGoals.length) {
    html += `<div style="margin-top:14px">
      <h4 style="margin:0 0 8px 0;font-size:14px">${createdGoals.length ? '✅' : '💡'} ${createdGoals.length ? `${createdGoals.length} Goals Created` : `${suggestedGoals.length} Goals Suggested`}</h4>
      ${suggestedGoals.map((g, i) => {
        const created = createdGoals.find(c => c.title === g.title);
        return `<div class="research-goal-card">
          <div class="rg-body">
            <div class="rg-title">${created ? '✅' : '💡'} ${esc(g.title)}</div>
            <div class="rg-desc">${esc(g.description)}</div>
            ${renderDetailList('Roadmap', g.roadmap)}
            ${renderDetailList('Execution Instructions', g.instruction_steps)}
            ${renderDetailList('Day-by-Day Hour Plan', g.daily_plan)}
            ${renderDetailList('Schedule Fit Notes', g.schedule_fit_notes)}
            ${renderSubgoals(g)}
            ${renderDetailList('Prerequisites', g.prerequisites)}
            ${renderDetailList('Shopping List', g.shopping_list)}
            ${renderDetailList('Context Notes', g.context_notes)}
            <div class="rg-tags">
              <span class="rg-tag">Priority: ${g.priority}/5</span>
              <span class="rg-tag">Difficulty: ${g.difficulty}/10</span>
              ${g.time_commitment_hours ? `<span class="rg-tag">${g.time_commitment_hours}h estimated</span>` : ''}
              ${g.target_date_hint ? `<span class="rg-tag">📅 ${esc(g.target_date_hint)}</span>` : ''}
              ${created ? `<span class="rg-tag" style="color:var(--green);border-color:var(--green)">Created (ID: ${created.id})</span>` : ''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

    html += `<div style="margin-top:8px;text-align:right;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="openCreateLtoModal()">Create LTO</button>
      ${!createdGoals.length && suggestedGoals.length ? '<button class="btn btn-primary" onclick="createResearchGoals()">Create These Goals</button>' : ''}
    </div>`;
  }

  resultsDiv.innerHTML = html || '<div class="research-loading">No results returned.</div>';

  // Store last research for post-generation actions
  window._lastResearchTopic = topic;
  window._lastResearchArea = areaEl && areaEl.value ? Number(areaEl.value) : null;
  window._lastResearchSuggestedGoals = Array.isArray(suggestedGoals) ? suggestedGoals : [];
}

  const resultsDiv = document.getElementById('research-results');
  if (resultsDiv) {
    const btn = resultsDiv.querySelector('.btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  }

  const res = await api('ai/research', {
    method: 'POST',
    body: {
      topic: window._lastResearchTopic,
      life_area_id: window._lastResearchArea,
      create_goals: 1,
      token_limit: 2000,

  if (showApiError(res)) return;
  const created = res.created_goals || [];
  toast(`Created ${created.length} goal${created.length !== 1 ? 's' : ''} from research`);
  renderAiInterface(document.getElementById('content'));
}

async function confirmCreateResearchLTO() {
  const form = document.getElementById('research-lto-form');
  if (!form) return;
  const mode = form.target_mode ? String(form.target_mode.value || 'new') : 'new';

  if (mode === 'new') {
    const groupName = form.group_name ? String(form.group_name.value || '').trim() : '';
    const sectionLabel = form.section_label ? String(form.section_label.value || '').trim() : '';
    if (!groupName) {
      toast('Enter a group name');
      return;
    }
    if (!sectionLabel) {
      toast('Enter a section name');
      return;
    }

    const sectionRes = await api('sidebar', {
      method: 'POST',
      body: {
        group_name: groupName,
        label: sectionLabel,
        section_type: 'long_term_objective',
      },
    });
    if (showApiError(sectionRes)) return;
    const sectionKey = String(sectionRes.page_key || '').trim();
    if (!sectionKey) {
      toast('Created section but missing page key');
      return;
    }
    await createResearchLTO(sectionKey, { navigateToSection: true });
    return;
  }

  const sectionKey = form.section_key ? String(form.section_key.value || '').trim() : '';
  if (!sectionKey) {
    toast('Select a target section');
    return;
  }
  await createResearchLTO(sectionKey, { navigateToSection: true });
}

async function createResearchLTO(sectionKey, options = {}) {
  const goals = Array.isArray(window._lastResearchSuggestedGoals) ? window._lastResearchSuggestedGoals : [];
  if (!goals.length) {
    toast('Run research first to generate goals');
    return;
  }

  const status = statuses.find(s => String(s.color || '').toLowerCase() === 'blue') || statuses[0];
  if (!status || !status.id) {
    toast('No statuses available to create LTO items');
    return;
  }

  let created = 0;
  let failed = 0;

  // Preserve deterministic unlock sequencing by explicitly controlling sort_order.
  const existing = await getList('custom/' + sectionKey, 'Failed to load custom items for sequencing');
  let nextSortOrder = Array.isArray(existing) && existing.length
    ? Math.max(...existing.map(it => Number(it.sort_order || 0))) + 1
    : 0;

  const deriveSubgoalsFromRoadmap = (goal) => {
    const roadmap = Array.isArray(goal?.roadmap) ? goal.roadmap.map(v => String(v || '').trim()).filter(Boolean) : [];
    if (!roadmap.length) return [];
    return roadmap.map((step, idx) => ({
      title: `Phase ${idx + 1}`,
      description: step,
      roadmap: [step],
      instruction_steps: [],
      daily_plan: [],
      time_commitment_hours: 0,
      target_date_hint: '',
    }));
  };

  for (const g of goals) {
    const title = String(g.title || '').trim();
    if (!title) {
      failed += 1;
      continue;
    }
    const detailBits = [];
    if (g.description) detailBits.push(String(g.description).trim());
    detailBits.push(`Source topic: ${window._lastResearchTopic || 'Research'}`);
    if (g.target_date_hint) detailBits.push(`Target hint: ${g.target_date_hint}`);
    if (g.time_commitment_hours) detailBits.push(`Estimated hours: ${g.time_commitment_hours}`);
    const roadmap = Array.isArray(g.roadmap) ? g.roadmap.map(v => String(v || '').trim()).filter(Boolean) : [];
    const instructions = Array.isArray(g.instruction_steps) ? g.instruction_steps.map(v => String(v || '').trim()).filter(Boolean) : [];
    const dailyPlan = Array.isArray(g.daily_plan) ? g.daily_plan.map(v => String(v || '').trim()).filter(Boolean) : [];
    const scheduleFitNotes = Array.isArray(g.schedule_fit_notes) ? g.schedule_fit_notes.map(v => String(v || '').trim()).filter(Boolean) : [];
    const prereqs = Array.isArray(g.prerequisites) ? g.prerequisites.map(v => String(v || '').trim()).filter(Boolean) : [];
    const shopping = Array.isArray(g.shopping_list) ? g.shopping_list.map(v => String(v || '').trim()).filter(Boolean) : [];
    const contextNotes = Array.isArray(g.context_notes) ? g.context_notes.map(v => String(v || '').trim()).filter(Boolean) : [];
    if (roadmap.length) detailBits.push('Roadmap:\n- ' + roadmap.join('\n- '));
    if (instructions.length) detailBits.push('Execution Instructions:\n- ' + instructions.join('\n- '));
    if (dailyPlan.length) detailBits.push('Day-by-Day Hour Plan:\n- ' + dailyPlan.join('\n- '));
    if (scheduleFitNotes.length) detailBits.push('Schedule Fit Notes:\n- ' + scheduleFitNotes.join('\n- '));
    if (prereqs.length) detailBits.push('Prerequisites:\n- ' + prereqs.join('\n- '));
    if (shopping.length) detailBits.push('Shopping List:\n- ' + shopping.join('\n- '));
    if (contextNotes.length) detailBits.push('Context Notes:\n- ' + contextNotes.join('\n- '));

    const subgoals = (Array.isArray(g.subgoals) && g.subgoals.length)
      ? g.subgoals
      : deriveSubgoalsFromRoadmap(g);
    if (subgoals.length) {
      // Insert a visual group header so subgoals render as a roadmap section.
      const headerRes = await api('custom/' + sectionKey, {
        method: 'POST',
        body: {
          name: '━━━ ' + title,
          status_id: Number(status.id),
          notes: 'AI-generated subgoal roadmap section',
          is_long_term_objective: 0,
          sort_order: nextSortOrder++,
        },
      });
      if (apiHasError(headerRes)) failed += 1;

      for (const [idx, sg] of subgoals.entries()) {
        const sgTitle = String(sg?.title || '').trim();
        if (!sgTitle) {
          failed += 1;
          continue;
        }
        const sgBits = [];
        if (sg.description) sgBits.push(String(sg.description).trim());
        const sgRoadmap = Array.isArray(sg.roadmap) ? sg.roadmap.map(v => String(v || '').trim()).filter(Boolean) : [];
        const sgSteps = Array.isArray(sg.instruction_steps) ? sg.instruction_steps.map(v => String(v || '').trim()).filter(Boolean) : [];
        const sgDaily = Array.isArray(sg.daily_plan) ? sg.daily_plan.map(v => String(v || '').trim()).filter(Boolean) : [];
        if (sg.target_date_hint) sgBits.push(`Target hint: ${sg.target_date_hint}`);
        if (sg.time_commitment_hours) sgBits.push(`Estimated hours: ${sg.time_commitment_hours}`);
        if (sgRoadmap.length) sgBits.push('Subgoal Roadmap:\n- ' + sgRoadmap.join('\n- '));
        if (sgSteps.length) sgBits.push('Subgoal Execution Instructions:\n- ' + sgSteps.join('\n- '));
        if (sgDaily.length) sgBits.push('Subgoal Day-by-Day Hour Plan:\n- ' + sgDaily.join('\n- '));
        if (scheduleFitNotes.length) sgBits.push('Schedule Fit Notes:\n- ' + scheduleFitNotes.join('\n- '));
        if (prereqs.length) sgBits.push('Prerequisites:\n- ' + prereqs.join('\n- '));
        if (shopping.length) sgBits.push('Shopping List:\n- ' + shopping.join('\n- '));
        if (contextNotes.length) sgBits.push('Context Notes:\n- ' + contextNotes.join('\n- '));
        sgBits.push(`Parent roadmap: ${title}`);
        sgBits.push(`Source topic: ${window._lastResearchTopic || 'Research'}`);

        const resSub = await api('custom/' + sectionKey, {
          method: 'POST',
          body: {
            name: `${idx + 1}. ${sgTitle}`,
            status_id: Number(status.id),
            notes: sgBits.join('\n\n'),
            is_long_term_objective: 1,
            sort_order: nextSortOrder++,
          },
        });
        if (apiHasError(resSub)) failed += 1;
        else created += 1;
      }
      continue;
    }

    const res = await api('custom/' + sectionKey, {
      method: 'POST',
      body: {
        name: title,
        status_id: Number(status.id),
        notes: detailBits.join('\n\n'),
        is_long_term_objective: 1,
        sort_order: nextSortOrder++,
      },
    });
    if (apiHasError(res)) failed += 1;
    else created += 1;
  }

  closeModal();
  if (created && !failed) {
    toast(`Created ${created} LTO${created !== 1 ? 's' : ''}`);
  } else if (created && failed) {
    toast(`Created ${created} LTO${created !== 1 ? 's' : ''}, ${failed} failed`);
  } else {
    toast('Failed to create LTO items');
  }

  if (created) {
    await refreshCoreData();
    if (options && options.navigateToSection) {
      navigateTo(sectionKey);
    } else {
      await loadPage(currentPage);
    }
  }
}

function resetAiChat() {
  aiChatHistory = [];
  renderAiMessages();
}

function toggleAiApplyOption() {
  const empowered = document.getElementById('ai-empowered');
  const apply = document.getElementById('ai-apply-changes');
  if (!empowered || !apply) return;
  if (!empowered.checked) {
    apply.checked = false;
    apply.disabled = true;
  } else {
    apply.disabled = false;
  }
}

async function sendAiQuery() {
  const input = document.getElementById('ai-query-input');
  const includeSchedule = document.getElementById('ai-include-schedule');
  const tokenLimitEl = document.getElementById('ai-token-limit');
  const empoweredEl = document.getElementById('ai-empowered');
  const applyChangesEl = document.getElementById('ai-apply-changes');
  if (!input) return;
  const prompt = (input.value || '').trim();
  if (!prompt) {
    toast('Enter a prompt first');
    return;
  }

  aiChatHistory.push({ role: 'user', content: prompt });
  aiChatHistory.push({ role: 'assistant', content: 'Thinking…', mode: 'pending' });
  renderAiMessages();
  input.value = '';

  const history = aiChatHistory
    .filter(m => m.mode !== 'pending')
    .slice(-8)
    .map(m => ({ role: m.role, content: m.content }));

  const res = await api('ai/query', {
    method: 'POST',
    body: {
      prompt,
      history,
      include_schedule_context: includeSchedule && includeSchedule.checked ? 1 : 0,
      token_limit: tokenLimitEl && tokenLimitEl.value ? Number(tokenLimitEl.value) : 700,
      empowered: empoweredEl && empoweredEl.checked ? 1 : 0,
      apply_changes: applyChangesEl && applyChangesEl.checked ? 1 : 0,
    },
  });

  aiChatHistory = aiChatHistory.filter(m => m.mode !== 'pending');
  if (showApiError(res)) {
    aiChatHistory.push({ role: 'assistant', content: 'I could not process that request. Please try again.', mode: 'error' });
    renderAiMessages();
    return;
  }

  const editMeta = (res.proposed_edits !== undefined)
    ? ` · edits ${res.applied_edits || 0}/${res.proposed_edits || 0}`
    : '';
  aiChatHistory.push({
    role: 'assistant',
    content: String(res.answer || '').trim() || 'No answer returned.',
    mode: `${res.mode || 'heuristic'} · limit ${res.token_limit || 'n/a'}${editMeta}`,
  });
  renderAiMessages();
}

// ── Custom Sections ──
async function renderCustomSection(c, sectionKey) {
  const section = sidebarSections.find(s => s.page_key === sectionKey);
  const label = section ? section.label : sectionKey;
  const items = await getList('custom/' + sectionKey, 'Failed to load custom items');
  const isLongTermPage = section ? Number(section.is_long_term_section || 0) === 1 : sectionKey === 'custom_financial_theory';

  // Group items by section headers (names starting with ━━━)
  const groups = [];
  let current = { header: null, items: [] };
  items.forEach(it => {
    if (it.name.startsWith('━━━')) {
      if (current.header || current.items.length) groups.push(current);
      current = { header: it, items: [] };
    } else {
      current.items.push(it);
    }
  });
  if (current.header || current.items.length) groups.push(current);

  const ltoLockedById = {};
  const ltoLockReasonById = {};
  if (isLongTermPage) {
    // Track the first incomplete objective across ALL groups/phases,
    // not just within each phase. This ensures later phases stay locked
    // until all prior phases are fully completed.
    let firstIncompleteName = null;
    groups.forEach(g => {
      g.items.forEach(it => {
        if (Number(it.is_long_term_objective || 0) !== 1) return;
        const done = Number(it.objective_completed || 0) === 1;
        if (!done && firstIncompleteName) {
          ltoLockedById[it.id] = 1;
          ltoLockReasonById[it.id] = firstIncompleteName;
          return;
        }
        if (!done && !firstIncompleteName) {
          firstIncompleteName = String(it.name || 'prior objective');
        }
      });
    });
  }

  function renderNotes(notes) {
    if (!notes) return '';
    return `<div class="item-notes">${esc(notes).replace(/\n/g, '<br>')}</div>`;
  }

  function renderItem(it, sKey) {
    const taskBadge = it.is_task ? (it.is_quick_objective ? `<span class="task-badge qo-badge">QO</span>` : `<span class="task-badge">Task</span>`) : '';
    const longTermBadge = it.is_long_term_objective ? `<span class="task-badge lto-badge">LTO</span>` : '';
    const taskInfo = it.is_task ? `<div class="task-schedule">${it.is_quick_objective ? '<em>anytime</em>' : esc(it.task_time || '')}${it.task_count ? ` · ${it.task_count}×` : ''}${it.task_interval ? ` ${esc(it.task_interval)}` : ''}${it.subgroup ? ` · ${esc(it.subgroup)}` : ''}</div>` : '';
    const optimizeBtn = (it.is_task && !it.is_quick_objective) ? `<button class="btn-icon" onclick="event.stopPropagation(); optimizeTask('${esc(sKey)}', ${it.id})" title="Optimize within schedule">⏱</button>` : '';
    const isDone = Number(it.objective_completed || 0) === 1;
    const isLocked = Number(ltoLockedById[it.id] || 0) === 1 && !isDone;
    const lockReason = String(ltoLockReasonById[it.id] || 'Complete prior objective first');
    const completeBtn = isLocked
      ? `<button class="btn btn-sm" disabled title="Complete prior objective first">🔒 Locked</button>`
      : `<button class="btn btn-sm ${isDone ? '' : 'btn-primary'}" onclick="toggleObjectiveComplete('${esc(sKey)}', ${it.id}, ${isDone ? 1 : 0})">${isDone ? 'Undo Complete' : 'Complete Objective'}</button>`;

    if (isLongTermPage && Number(it.is_long_term_objective || 0) === 1) {
      return `<li class="custom-item lto-item ${isDone ? 'lto-done' : ''}" draggable="true" data-item-id="${it.id}"
        ondragstart="onItemDragStart(event, ${it.id})"
        ondragover="onItemDragOver(event)"
        ondrop="onItemDrop(event, '${esc(sKey)}', ${it.id})"
        ondragend="onItemDragEnd(event)">
        <div class="lto-marker">
          <span class="lto-dot"></span>
          <span class="lto-line"></span>
        </div>
        <div class="lto-card">
          <div class="lto-head">
            ${statusDot(it.status_color)}
            <span class="item-name lto-name">${esc(it.name)} ${longTermBadge}${taskBadge}</span>
            ${it.sessions_required > 1 ? `<span class="task-badge sessions-badge" title="${it.sessions_required} study sessions required">${it.sessions_required} sessions</span>` : ''}
            ${it.link ? `<a href="${esc(it.link)}" target="_blank" class="item-link">Link</a>` : ''}
            ${completeBtn}
            <button class="btn-icon" onclick="openCustomItemModal('${esc(sKey)}', ${it.id})">✎</button>
            <button class="btn-icon btn-danger" onclick="deleteCustomItem('${esc(sKey)}', ${it.id})">✕</button>
          </div>
          ${isLocked ? `<div class="lto-notes" style="color:var(--orange)">Locked until completed: ${esc(lockReason)}</div>` : ''}
          ${it.sessions_required > 1 ? `<div class="lto-sessions-info">📅 ${it.sessions_required} day${it.sessions_required !== 1 ? 's' : ''} of study required to complete this objective</div>` : ''}
          ${taskInfo}
          ${it.notes ? `<div class="lto-notes">${esc(it.notes).replace(/\n/g, '<br>')}</div>` : ''}
        </div>
      </li>`;
    }

    return `<li class="custom-item" draggable="true" data-item-id="${it.id}"
      ondragstart="onItemDragStart(event, ${it.id})"
      ondragover="onItemDragOver(event)"
      ondrop="onItemDrop(event, '${esc(sKey)}', ${it.id})"
      ondragend="onItemDragEnd(event)">
      <div class="item-row">
        <span class="drag-handle-item" title="Drag to reorder">⠿</span>
        ${statusDot(it.status_color)}
        <span class="item-name">${esc(it.name)} ${longTermBadge}${taskBadge}</span>
        ${it.link ? `<a href="${esc(it.link)}" target="_blank" class="item-link">Link</a>` : ''}
        <div class="item-actions">
          ${optimizeBtn}
          <button class="btn-icon" onclick="openCustomItemModal('${esc(sKey)}', ${it.id})">✎</button>
          <button class="btn-icon btn-danger" onclick="deleteCustomItem('${esc(sKey)}', ${it.id})">✕</button>
        </div>
      </div>
      ${taskInfo}
      ${renderNotes(it.notes)}
    </li>`;
  }

  const hasGroups = groups.some(g => g.header);
  const totalObjectives = items.filter(it => !it.name.startsWith('━━━') && it.is_long_term_objective).length;
  const completedObjectives = items.filter(it => !it.name.startsWith('━━━') && it.is_long_term_objective && Number(it.objective_completed || 0) === 1).length;
  const addLabel = isLongTermPage ? '+ Add Long-Term Objective' : '+ Add Item';
  const titleText = isLongTermPage ? `${label} · Long-Term Objectives` : label;

  c.innerHTML = `
    <div class="page-header">
      <h2>${esc(titleText)}</h2>
      <div style="display:flex;gap:8px">
        ${isLongTermPage ? `<button class="btn" onclick="exportLongTermRoadmap('${esc(sectionKey)}', '${esc(label)}')">Export Roadmap as TXT</button>` : ''}
        <button class="btn btn-primary" onclick="openCustomItemModal('${esc(sectionKey)}')">${addLabel}</button>
      </div>
    </div>
    ${isLongTermPage ? `<div class="card-subtitle" style="margin-bottom:14px">${totalObjectives} long-term objectives tracked in this roadmap. ${completedObjectives} completed.</div>` : ''}
    <div class="legend">
      <div class="legend-item">${statusDot('green')} Have / Current</div>
      <div class="legend-item">${statusDot('blue')} Next Up</div>
      <div class="legend-item">${statusDot('orange')} Eventual</div>
      <div class="legend-item">${statusDot('red')} Action Needed</div>
      ${isLongTermPage ? `<div class="legend-item"><span class="task-badge lto-badge" style="margin-left:0">LTO</span> Long-Term Objective</div>` : ''}
    </div>
    ${hasGroups ? groups.map(g => `
      <div class="card">
        ${g.header ? `<h3>${isLongTermPage ? 'Long-Term Objectives: ' : ''}${esc(g.header.name.replace(/━/g, '').trim())}</h3>
        ${g.header.notes ? `<div class="card-subtitle">${esc(g.header.notes)}</div>` : ''}` : ''}
        <ul class="item-list ${isLongTermPage ? 'lto-timeline' : ''}">
          ${g.items.map(it => renderItem(it, sectionKey)).join('')}
          ${g.items.length === 0 && !g.header ? '<li class="item-row" style="color:var(--text-muted)">No items</li>' : ''}
        </ul>
      </div>
    `).join('') : `
      <div class="card">
        <ul class="item-list ${isLongTermPage ? 'lto-timeline' : ''}">
          ${items.map(it => renderItem(it, sectionKey)).join('')}
        </ul>
        ${items.length === 0 ? '<div class="empty-state">No items yet. Click + to add one.</div>' : ''}
      </div>`}`;
}

async function exportLongTermRoadmap(sectionKey, label) {
  const section = sidebarSections.find(s => s.page_key === sectionKey);
  const isLongTermPage = section ? Number(section.is_long_term_section || 0) === 1 : false;
  if (!isLongTermPage) {
    toast('TXT export is available only for long-term objective sections');
    return;
  }

  const items = await getList('custom/' + sectionKey, 'Failed to load custom items', { toastOnError: true });
  if (items.length === 0) {
    toast('No objectives found to export');
    return;
  }

  const lines = [];
  const now = new Date().toLocaleString();
  const objectives = items.filter(it => !String(it.name || '').startsWith('━━━') && Number(it.is_long_term_objective || 0) === 1);
  const completed = objectives.filter(it => Number(it.objective_completed || 0) === 1).length;

  lines.push(`Roadmap: ${label}`);
  lines.push(`Exported: ${now}`);
  lines.push(`Objectives: ${objectives.length}`);
  lines.push(`Completed: ${completed}`);
  lines.push('');

  let currentHeader = null;
  for (const it of items) {
    const name = String(it.name || '');
    if (name.startsWith('━━━')) {
      currentHeader = name.replace(/━/g, '').trim();
      lines.push(`## ${currentHeader}`);
      if (it.notes) lines.push(it.notes);
      lines.push('');
      continue;
    }

    if (Number(it.is_long_term_objective || 0) !== 1) continue;
    const done = Number(it.objective_completed || 0) === 1 ? '[x]' : '[ ]';
    lines.push(`${done} ${name}`);
    if (it.status_name) lines.push(`  Status: ${it.status_name}`);
    if (it.link) lines.push(`  Link: ${it.link}`);
    if (it.notes) {
      for (const noteLine of String(it.notes).split('\n')) {
        lines.push(`  ${noteLine}`);
      }
    }
    lines.push('');
  }

  const text = lines.join('\n').trim() + '\n';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  const safeLabel = String(label || 'roadmap').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = `${safeLabel || 'roadmap'}_roadmap.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('Roadmap exported as TXT');
}

async function saveCustomItem(sectionKey, id) {
  const data = getFormData('custom-form');
  data.status_id = Number(data.status_id);
  data.sort_order = Number(data.sort_order) || 0;
  const isLTOCheck = document.getElementById('is-lto-check');
  data.is_long_term_objective = (isLTOCheck && isLTOCheck.checked) ? 1 : 0;
  const isTaskCheck = document.getElementById('is-task-check');
  data.is_task = isTaskCheck && isTaskCheck.checked ? 1 : 0;
  const isQOCheck = document.getElementById('is-qo-check');
  data.is_quick_objective = (isQOCheck && isQOCheck.checked) ? 1 : 0;
  if (!data.is_task) {
    data.task_time = null;
    data.task_count = null;
    data.task_interval = null;
    data.is_quick_objective = 0;
  } else {
    if (data.is_quick_objective) data.task_time = null;
    data.task_count = data.task_count ? Number(data.task_count) : null;
    data.task_interval = data.task_interval || null;
  }
  data.subgroup = data.subgroup || null;
  let res;
  if (id) res = await api('custom/' + sectionKey + '/' + id, { method: 'PUT', body: data });
  else res = await api('custom/' + sectionKey, { method: 'POST', body: data });
  if (showApiError(res)) return;
  closeModal();
  toast(id ? 'Item updated' : 'Item added');
  loadPage(sectionKey);
}

// ── Item drag-to-reorder ──
let dragItemId = null;
function onItemDragStart(e, id) {
  dragItemId = id;
  e.target.closest('.custom-item').classList.add('dragging-item');
  e.dataTransfer.effectAllowed = 'move';
}
function onItemDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const li = e.target.closest('.custom-item');
  if (li) {
    document.querySelectorAll('.custom-item.drag-over-item').forEach(el => el.classList.remove('drag-over-item'));
    li.classList.add('drag-over-item');
  }
}
function onItemDragEnd(e) {
  dragItemId = null;
  document.querySelectorAll('.dragging-item, .drag-over-item').forEach(el => {
    el.classList.remove('dragging-item', 'drag-over-item');
  });
}
async function onItemDrop(e, sectionKey, targetId) {
  e.preventDefault();
  if (!dragItemId || dragItemId === targetId) { onItemDragEnd(e); return; }
  // Get all items in DOM order, reorder
  const list = e.target.closest('.item-list');
  if (!list) { onItemDragEnd(e); return; }
  const ids = [...list.querySelectorAll('.custom-item[data-item-id]')].map(el => Number(el.dataset.itemId));
  const fromIdx = ids.indexOf(dragItemId);
  const toIdx = ids.indexOf(targetId);
  if (fromIdx < 0 || toIdx < 0) { onItemDragEnd(e); return; }
  ids.splice(fromIdx, 1);
  ids.splice(toIdx, 0, dragItemId);
  onItemDragEnd(e);
  const res = await api('custom/' + sectionKey + '/reorder', { method: 'PUT', body: { order: ids } });
  if (showApiError(res)) return;
  loadPage(currentPage);
}

function queueDashboardSearch() {
  if (dashboardSearchTimer) clearTimeout(dashboardSearchTimer);
  dashboardSearchTimer = setTimeout(dashboardSearch, 220);
}

async function dashboardSearch() {
  const input = document.getElementById('dashboard-search-input');
  const out = document.getElementById('dashboard-search-results');
  if (!input || !out) return;

  const q = (input.value || '').trim();
  if (q.length < 2) {
    out.innerHTML = q.length === 0 ? '' : '<div class="empty-state" style="padding:8px 0;">Type at least 2 characters.</div>';
    return;
  }

  const res = await api('search?q=' + encodeURIComponent(q) + '&limit=8');
  if (apiHasError(res)) {
    out.innerHTML = `<div class="empty-state" style="padding:8px 0;">${esc(res.error || 'Search failed')}</div>`;
    return;
  }

  const results = Array.isArray(res.results) ? res.results : [];
  if (results.length === 0) {
    out.innerHTML = '<div class="empty-state" style="padding:8px 0;">No matches found.</div>';
    return;
  }

  out.innerHTML = results.map(r => `
    <div class="dashboard-search-item" onclick="navigateTo('${esc(r.page_key || 'dashboard')}')">
      <div class="dashboard-search-title">${esc(r.title || '')}</div>
      <div class="dashboard-search-meta">${esc(r.source || '')}${r.subtitle ? ' • ' + esc(r.subtitle) : ''}</div>
    </div>
  `).join('');
}
